<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant B</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT B — "Ivory & blush"
   Cream ground, maroon ink, one flat blush field. The two women are
   background-removed cutouts placed at full editorial scale, frameless,
   cropped only by the canvas edge. Clean grid, wide margins, crisp modern
   type setting, one small gold accent and nothing else.
   ======================================================================= */

.canvas {
  background: var(--cream);
  color: var(--maroon-rich);
  font-family: var(--serif);

  --m: 84px;          /* content margin */
  --ttl: 90px;        /* display size */
  --host: 47px;
  --lbl: 15px;
  --topic: 34px;
  --name: 30px;
  --role: 25px;
  --date: 48px;
  --logo: 128px;

  --horizon: 698px;   /* y of the blush field edge */
  --fw1: 680px; --fx1: -84px; --fy1: 706px;   /* Mohinur  */
  --fw2: 600px; --fx2: 605px; --fy2: 738px;   /* Sarvinoz */

  --g-host: 18px;     /* title -> host */
  --g-rule: 48px;     /* host  -> rule */
  --g-block: 26px;    /* rule  -> block */
  --g-cols: 36px;     /* block -> rule */
  --colgap: 56px;
}

html[data-r="9x16"] .canvas {
  --m: 96px;
  --ttl: 138px; --host: 66px; --lbl: 18px; --topic: 50px;
  --name: 48px; --role: 34px; --date: 70px; --logo: 168px;
  --horizon: 1206px;
  --fw1: 720px; --fx1: -126px; --fy1: 1258px;
  --fw2: 650px; --fx2: 586px; --fy2: 1296px;
  --g-host: 26px; --g-rule: 86px; --g-block: 44px; --g-cols: 70px;
}

html[data-r="1x1"] .canvas {
  --m: 76px;
  --ttl: 67px; --host: 36px; --lbl: 13px; --topic: 28px;
  --name: 25px; --role: 21px; --date: 41px; --logo: 104px;
  --horizon: 544px;
  --fw1: 620px; --fx1: -32px; --fy1: 552px;
  --fw2: 555px; --fx2: 561px; --fy2: 578px;
  --g-host: 13px; --g-rule: 30px; --g-block: 18px; --g-cols: 22px;
  --colgap: 44px;
}

/* 9:16 has the height for a stacked info block: the topic runs the full
   column width and the guest credit sits under it, flush right, pointing at
   the figure on the right. 4:5 and 1:1 run the same two items as columns. */
html[data-r="9x16"] .cols { flex-direction: column; align-items: stretch; gap: 52px; }

/* ---------------------------- ground ---------------------------- */
.horizon {
  position: absolute;
  left: 0; right: 0;
  top: var(--horizon);
  bottom: 0;
  background: linear-gradient(180deg, #f6e8e2 0%, var(--blush) 46%, #eedbd4 100%);
}

/* ---------------------------- people ---------------------------- */
.figs { position: absolute; inset: 0; overflow: hidden; }
.fig { position: absolute; display: block; height: auto; }
.fig--m { width: var(--fw1); left: var(--fx1); top: var(--fy1); }
.fig--s { width: var(--fw2); left: var(--fx2); top: var(--fy2); }

/* ---------------------------- type ---------------------------- */
.head {
  position: absolute;
  left: var(--m); right: var(--m); top: var(--m);
  z-index: 2;
}

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }

.title {
  margin: 0;
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--ttl);
  line-height: 0.98;
  letter-spacing: -0.02em;
  color: var(--maroon-rich);
}

.mark { width: var(--logo); height: auto; margin-top: calc(var(--ttl) * 0.08); }

.host {
  margin: var(--g-host) 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--host);
  line-height: 1.14;
  color: var(--maroon);
}

.hair {
  margin: var(--g-rule) 0 0;
  height: 1px; border: 0;
  background: rgba(147, 6, 31, 0.22);
}

.lbl {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--lbl);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(147, 6, 31, 0.8);
  display: block;
}

.cols {
  display: flex;
  gap: var(--colgap);
  margin-top: var(--g-block);
  align-items: flex-start;
}
.col-topic { flex: 1 1 auto; }
.col-guest { flex: 0 0 auto; text-align: right; }
.col-guest .lbl { margin-right: -0.3em; }

.topic-t {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--topic);
  line-height: 1.2;
  color: var(--maroon-rich);
}
.gname {
  margin-top: 10px;
  font-family: var(--roman);
  font-size: var(--name);
  line-height: 1.12;
  color: var(--maroon-rich);
}
.grole {
  margin-top: 5px;
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--role);
  line-height: 1.18;
  color: rgba(147, 6, 31, 0.9);
}

/* the post's single ornament: a hairline rule with one anchor dot, in gold */
.dot-rule {
  margin-top: var(--g-cols);
  width: calc(var(--date) * 7.2);
  height: calc(var(--date) * 7.2 * 16 / 600);
  -webkit-mask: url("assets/orn/mark-rule-dot.svg") left center/contain no-repeat;
  mask: url("assets/orn/mark-rule-dot.svg") left center/contain no-repeat;
  background: var(--gold-deep);
}

/* ---------------------------- date row ---------------------------- */
.when {
  display: flex;
  align-items: baseline;
  gap: calc(var(--date) * 0.6);
  margin-top: calc(var(--g-block) * 0.9);
}
.w-date {
  flex: 0 0 auto;
  white-space: nowrap;
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--date);
  line-height: 1.1;
  color: var(--maroon-rich);
}
.w-place {
  flex: 0 0 auto;
  white-space: nowrap;
  margin-left: auto;
  margin-right: -0.24em;
  font-family: var(--sans);
  font-weight: 400;
  font-size: calc(var(--date) * 0.4);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--maroon);
}
</style>
</head>
<body>
<div class="canvas grain">
  <div class="horizon"></div>

  <div class="figs">
    <img class="fig fig--m" src="assets/cutout/mohinur-cut-soft.png" alt="Mohinur Abdullayeva">
    <img class="fig fig--s" src="assets/cutout/sarvinoz-cut-soft.png" alt="Sarvinoz Alisherovna">
  </div>

  <div class="head">
    <div class="topbar">
      <h1 class="title">Diva klubi<br> uchrashuvi</h1>
      <img class="mark" src="assets/logo-trim.png" alt="Diva Women Networking Club">
    </div>

    <p class="host">Mohinur Abdullayeva bilan</p>

    <hr class="hair">

    <div class="cols">
      <div class="col-topic">
        <span class="lbl">Uchrashuv mavzusi</span>
        <p class="topic-t">Shukronalik hissi.<br>1 ta katta maqsad uchun ongni tayyorlash</p>
      </div>
      <div class="col-guest">
        <span class="lbl">Mehmon spiker</span>
        <div class="gname">Sarvinoz Alisherovna</div>
        <div class="grole">psixolog, vrach psixoterapevt</div>
      </div>
    </div>

    <div class="dot-rule"></div>

    <div class="when">
      <span class="w-date num">16-sentabr</span>
      <span class="w-date num">11:00</span>
      <span class="w-place">Toshkent sh.</span>
    </div>
  </div>
</div>
</body>
</html>
