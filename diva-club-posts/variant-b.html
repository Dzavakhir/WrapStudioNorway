<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant B</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT B — "Ivory & blush"
   Cream ground, maroon ink, one flat blush field. The two women are
   background-removed cutouts placed at full editorial scale, frameless,
   cropped only by the canvas edge. Clean grid, wide margins, crisp modern
   type setting, two hairlines on the same measure (one maroon, one gold) that
   bracket the info block, and nothing else.
   ======================================================================= */

.canvas {
  background: var(--cream);
  color: var(--maroon-rich);
  font-family: var(--serif);

  --m: 84px;          /* content margin */
  --mt: var(--m);     /* top inset of the type block (9:16 clears the Story UI) */
  --ttl: 90px;        /* display size */
  --host: 47px;
  --lbl: 19px;
  --topic: 34px;
  --name: 30px;
  --role: 25px;
  --date: 48px;
  --place: 23px;      /* venue: its own floor, not a fraction of --date */
  --logo: 128px;

  --horizon: 698px;   /* y of the blush field edge */
  /* Both women are scaled about their OWN bleed edge (the source column that
     lands on the canvas edge is held constant), so each keeps exactly the edge
     crop she had while the empty blush column between them closes. */
  --fw1: 748px; --fx1: -92px; --fy1: 706px;   /* Mohinur  */
  --fw2: 660px; --fx2: 558px; --fy2: 742px;   /* Sarvinoz */

  --g-host: 18px;     /* title -> host */
  --g-rule: 48px;     /* host  -> rule */
  --g-block: 26px;    /* rule  -> block */
  --g-cols: 36px;     /* block -> rule */
  --g-when: calc(var(--g-block) * 0.9);  /* gold rule -> date row */
  --colgap: 56px;
  --rule-h: 9px;      /* box the gold hairline sits in — holds the block rhythm */
}

/* 9:16 is read as a Story: platform chrome eats roughly the top 140px and the
   bottom 250px of the 1080x1920 frame. The type block therefore starts at 150px
   (title cap-line lands at 164) and the whole cream field is a touch deeper, so
   nothing that carries information sits under the UI. Both faces finish well
   above y=1670. */
html[data-r="9x16"] .canvas {
  --m: 96px; --mt: 150px;
  --ttl: 126px; --host: 60px; --lbl: 17px; --topic: 44px;
  --name: 42px; --role: 30px; --date: 64px; --place: 26px; --logo: 156px;
  --horizon: 1035px;
  /* The 9:16 used to be cut at 68.6% down Mohinur's frame — below the
     collarbone, straight across the décolletage, leaving the last ~220px of a
     Story as bare shoulder and empty blush. Scaling her about the left edge
     (same edge crop, 12% larger) walks the canvas cut back up her body to the
     shoulder line: source row 1766 -> 1578, i.e. the crop line moves ~107px up
     her at the new scale. Sarvinoz is scaled the same way and re-seated so the
     two eye-lines stay on one line. */
  --fw1: 974px; --fx1: -319px; --fy1: 1025px;
  --fw2: 896px; --fx2: 523px;  --fy2: 1057px;
  --g-host: 22px; --g-rule: 40px; --g-block: 36px; --g-cols: 36px;
  --g-when: 23px; --rule-h: 12px;
}

html[data-r="1x1"] .canvas {
  --m: 76px;
  /* Square carries the smallest type in the set, so the sub-head levels are on
     their own legibility floor rather than on a strict ratio down from --topic:
     at feed scale (x0.37) a 1080px post is read at ~400px, and below ~10px a
     line stops reading as words. topic/name/role/label are sized from that
     floor up, which compresses the hierarchy here on purpose. */
  --ttl: 67px; --host: 36px; --lbl: 17px; --topic: 30px;
  --name: 28px; --role: 24px; --date: 41px; --place: 20px; --logo: 104px;
  --horizon: 562px;
  /* Square: at this scale both women only just missed the side edges (20px and
     18px of blush) — a tangent that reads as an accident. Nudged outward so each
     is genuinely cropped by her own edge, as they are in 4:5 and 9:16, then
     scaled about that same edge so the pair closes up.
     Mohinur carries an extra -12px here on top of the scale: the square is the
     only ratio short enough that growing her lifts the canvas cut above the
     widest part of her hair, and holding the source column alone would have
     dropped her bite on the left edge from 19px to 7px — straight back into the
     tangent. -12px restores it to 19px over 43 rows. */
  --fw1: 682px; --fx1: -91px; --fy1: 570px;
  --fw2: 610px; --fx2: 536px; --fy2: 599px;
  --g-host: 13px; --g-rule: 30px; --g-block: 18px; --g-cols: 22px;
  --colgap: 44px;
  --rule-h: 8px;
}

/* 9:16 has the height for a stacked info block: the topic runs the full
   column width and the guest credit sits under it, flush right, pointing at
   the figure on the right. 4:5 and 1:1 run the same two items as columns. */
html[data-r="9x16"] .cols { flex-direction: column; align-items: stretch; gap: 30px; }

/* ---------------------------- ground ---------------------------- */
.horizon {
  position: absolute;
  left: 0; right: 0;
  top: var(--horizon);
  bottom: 0;
  background: linear-gradient(180deg, #f6e8e2 0%, var(--blush) 46%, #eedbd4 100%);
}

/* ---------------------------- people ---------------------------- */
/* Plain -cut.png (not -cut-soft) per assets/cutout/INDEX-cutout.md: the soft
   matte is for maroon/gold grounds, the hard one is right on cream/ivory.
   Both women's eye-lines sit at ~25.4% of their frame, so --fy1/--fy2 are
   tuned to land both pairs of eyes on the same line in every ratio. */
.figs { position: absolute; inset: 0; overflow: hidden; }
.fig { position: absolute; display: block; height: auto; }
.fig--m { width: var(--fw1); left: var(--fx1); top: var(--fy1); }
.fig--s { width: var(--fw2); left: var(--fx2); top: var(--fy2); }

/* ---------------------------- type ---------------------------- */
.head {
  position: absolute;
  left: var(--m); right: var(--m); top: var(--mt);
  z-index: 2;
}

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }

.title {
  margin: 0;
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--ttl);
  line-height: 0.98;
  letter-spacing: -0.02em;
  /* optical margin: Playfair's cap D carries ~0.025em of side bearing, so the
     first line would otherwise sit 3px inside the stem of "uchrashuvi" below it.
     text-indent only touches the first line, which is exactly the one that needs it. */
  text-indent: -0.025em;
  color: var(--maroon-rich);
}

.mark { width: var(--logo); height: auto; margin-top: calc(var(--ttl) * 0.08); }

.host {
  margin: var(--g-host) 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--host);
  line-height: 1.14;
  color: var(--maroon);
}

.hair {
  margin: var(--g-rule) 0 0;
  height: 1px; border: 0;
  background: rgba(147, 6, 31, 0.22);
}

.lbl {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--lbl);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(147, 6, 31, 0.8);
  display: block;
}

.cols {
  display: flex;
  gap: var(--colgap);
  margin-top: var(--g-block);
  align-items: flex-start;
}
.col-topic { flex: 1 1 auto; }
.col-guest { flex: 0 0 auto; text-align: right; }
.col-guest .lbl { margin-right: -0.3em; }

.topic-t {
  margin: 10px 0 0;
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--topic);
  line-height: 1.2;
  color: var(--maroon-rich);
}
.gname {
  margin-top: 10px;
  font-family: var(--roman);
  font-size: var(--name);
  line-height: 1.12;
  color: var(--maroon-rich);
}
.grole {
  margin-top: 5px;
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--role);
  line-height: 1.18;
  color: rgba(147, 6, 31, 0.9);
}

/* One gold hairline above the date, running the full measure — the same span as
   the maroon .hair above the block, so the two rules read as one system that
   brackets the info block instead of a divider plus a dangling stub.
   It used to be mark-rule-dot.svg, drawn as a mask: a ~30-47% stub (the length
   varied per ratio because it was derived from --rule-h) carrying an off-centre
   dot. At the full measure the artwork cannot come along — stretching a 600x16
   box to 888x12 turns its round dot into an ellipse — and the dot had nothing to
   sit on anyway: the 9:16 info block is stacked, so there is no column boundary
   to anchor it to in all three ratios. It was also the one vintage-invitation
   gesture left in an otherwise modern block, so it goes.
   Drawn in CSS instead of masked, which fixes a second inconsistency: the SVG
   strokes its line at 1.5/16 of the element height, so the same "hairline" came
   out 1.125px on 9:16, 0.84px on 4:5 and 0.75px on 1:1 — one rule, three
   weights, none of them matching the 1px .hair. This is a true 1px line
   centred in a --rule-h box, so the block's vertical rhythm is unchanged to the
   pixel, and it starts exactly on the margin (the mask needed a -1.45em nudge
   to fake that). */
.rule-when {
  margin-top: var(--g-cols);
  height: var(--rule-h);
  background: linear-gradient(var(--gold-deep), var(--gold-deep)) left center / 100% 1px no-repeat;
}

/* ---------------------------- date row ---------------------------- */
.when {
  display: flex;
  align-items: baseline;
  gap: calc(var(--date) * 0.6);
  margin-top: var(--g-when);
}
.w-date {
  flex: 0 0 auto;
  white-space: nowrap;
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--date);
  line-height: 1.1;
  color: var(--maroon-rich);
}
.w-place {
  flex: 0 0 auto;
  white-space: nowrap;
  margin-left: auto;
  margin-right: -0.24em;
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--place);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--maroon);
}
</style>
</head>
<body>
<div class="canvas grain">
  <div class="horizon"></div>

  <div class="figs">
    <img class="fig fig--m" src="assets/cutout/mohinur-cut.png" alt="Mohinur Abdullayeva">
    <img class="fig fig--s" src="assets/cutout/sarvinoz-cut.png" alt="Sarvinoz Alisherovna">
  </div>

  <div class="head">
    <div class="topbar">
      <h1 class="title">Diva klubi<br> uchrashuvi</h1>
      <img class="mark" src="assets/logo-trim.png" alt="Diva Women Networking Club">
    </div>

    <p class="host">Mohinur Abdullayeva bilan</p>

    <hr class="hair">

    <div class="cols">
      <div class="col-topic">
        <span class="lbl">Uchrashuv mavzusi</span>
        <p class="topic-t">Shukronalik hissi.<br>1 ta katta maqsad uchun ongni tayyorlash</p>
      </div>
      <div class="col-guest">
        <span class="lbl">Mehmon spiker</span>
        <div class="gname">Sarvinoz Alisherovna</div>
        <div class="grole">psixolog, vrach psixoterapevt</div>
      </div>
    </div>

    <div class="rule-when"></div>

    <div class="when">
      <span class="w-date num">16-sentabr</span>
      <span class="w-date num">11:00</span>
      <span class="w-place">Toshkent sh.</span>
    </div>
  </div>
</div>
</body>
</html>
