<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant A</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT A — "Modern maroon"
   A deep maroon field, the two women placed large and frameless (a soft
   photographic dissolve — no ring, no window, no cut-out rectangle), and a
   contemporary centred type grid. Decoration budget: one gold hairline,
   two gold tick rules in the date row. Nothing else.
   ======================================================================= */

.canvas {
  background: #5d0416;
  color: var(--cream);
  font-family: var(--serif);

  /* ---- geometry (all overridden per ratio) ---- */
  --padX: 78px;
  --gTop: 74px;
  --gBot: 70px;

  --logoW: 146px;
  --gapLogo: 30px;
  --gapHost: 12px;

  --figW: 522px;
  --figH: 640px;
  --figOv: 120px;            /* horizontal overlap of the two photo boxes */
  --stageTop: 400px;
  --maskX: 15%;              /* side dissolve   */
  --maskT: 6%;               /* top dissolve    */
  --maskB: 26%;              /* bottom dissolve */

  --namesTop: 860px;
  --capW: 430px;
  --capOff: calc((var(--figW) - var(--figOv)) / 2);
  --scrimTop: 760px;

  /* ---- type ---- */
  --fsTitle: 78px;  --lhTitle: 1.0;
  --fsHost: 40px;
  --fsTag: 15px;  --fsName: 34px;  --fsRole: 25px;
  --fsLbl: 16px;  --fsTopic: 45px; --fsTopic2: 32px;
  --fsDate: 47px; --fsCity: 21px;
  --hairW: 168px; --gapHair: 28px; --gapWhen: 24px; --whenGap: 30px;
}

figure { margin: 0; }

/* ------------------------------------------------------------------ ground */
.ground {
  background:
    radial-gradient(56% 32% at 50% 40%, rgba(228, 182, 172, .12), transparent 74%),
    radial-gradient(116% 60% at 50% -8%, #9d1631 0%, #860c23 32%, rgba(134, 12, 35, 0) 72%),
    linear-gradient(180deg, #7e0b1f 0%, #6d0519 28%, #57 0314 0%, #560314 58%, #3f0210 84%, #300210 100%);
}

/* the maroon that swallows the lower half of the figures */
.scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  top: var(--scrimTop);
  background: linear-gradient(180deg,
    rgba(58, 3, 15, 0) 0%,
    rgba(56, 3, 14, .40) 26%,
    rgba(51, 2, 13, .84) 52%,
    rgba(45, 2, 12, .97) 72%,
    #300210 100%);
  pointer-events: none;
}

/* ------------------------------------------------------------------- stage */
.stage {
  position: absolute;
  left: 0; right: 0;
  top: var(--stageTop);
  height: var(--figH);
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.fig {
  position: relative;
  flex: 0 0 auto;
  width: var(--figW);
  height: var(--figH);
  -webkit-mask-image: linear-gradient(180deg,
      rgba(0,0,0,0) 0%, #000 var(--maskT),
      #000 calc(100% - var(--maskB)), rgba(0,0,0,0) 100%);
          mask-image: linear-gradient(180deg,
      rgba(0,0,0,0) 0%, #000 var(--maskT),
      #000 calc(100% - var(--maskB)), rgba(0,0,0,0) 100%);
}
.fig--s { margin-left: calc(var(--figOv) * -1); }

.fig-in {
  position: absolute;
  inset: 0;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg,
      rgba(0,0,0,0) 0%, #000 var(--maskX),
      #000 calc(100% - var(--maskX)), rgba(0,0,0,0) 100%);
          mask-image: linear-gradient(90deg,
      rgba(0,0,0,0) 0%, #000 var(--maskX),
      #000 calc(100% - var(--maskX)), rgba(0,0,0,0) 100%);
}
.fig--m .fig-in img { filter: brightness(1.07) contrast(1.02) saturate(.99); }
.fig--s .fig-in img { filter: brightness(.99) contrast(1.05) saturate(.80); }

/* Each source frame carries its own studio ground — Mohinur's is near-black,
   Sarvinoz's is beige. These two graded washes pull both of them into the
   same maroon before the mask dissolves the edge, so neither leaves a halo. */
.tone { position: absolute; inset: 0; }
.fig--m .tone {
  background: radial-gradient(58% 48% at 50% 30%,
    rgba(112, 8, 28, 0)   24%,
    rgba(104, 7, 25, .38) 52%,
    rgba(86, 5, 20, .82)  78%,
    rgba(66, 4, 16, .97) 100%);
}
.fig--s .tone {
  mix-blend-mode: multiply;
  background: radial-gradient(56% 46% at 49% 29%,
    rgba(255,255,255,0)   0%,
    rgba(255,255,255,0)   25%,
    rgba(206, 98, 116,.58) 46%,
    rgba(158, 20, 48, .94) 70%,
    rgba(126, 10, 32, 1)  86%,
    rgba(118, 9, 30, 1)  100%);
}
/* top + bottom edge wash so the dissolve always ends in maroon, never in a
   bright rim of studio backdrop */
.veil {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(58,3,14,.96) 0%, rgba(58,3,14,.62) 6%, rgba(58,3,14,0) 19%),
    linear-gradient(0deg,   rgba(50,2,13,1)   0%, rgba(50,2,13,.66) 12%, rgba(50,2,13,0) 36%);
}

/* -------------------------------------------------------------------- head */
.head {
  position: absolute;
  top: var(--gTop);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.logo { width: var(--logoW); margin: 0 auto; opacity: .95; }
.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsTitle);
  line-height: var(--lhTitle);
  letter-spacing: -.018em;
  color: #fdf7ee;
  margin: var(--gapLogo) 0 0;
}
.host {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--fsHost);
  line-height: 1.2;
  color: var(--gold-soft);
  margin: var(--gapHost) 0 0;
}

/* ------------------------------------------------------------------- names */
.names { position: absolute; top: var(--namesTop); left: 0; right: 0; height: 0; }
.cap {
  position: absolute;
  top: 0;
  width: var(--capW);
  transform: translateX(-50%);
  text-align: center;
}
.cap--l { left: calc(50% - var(--capOff)); }
.cap--r { left: calc(50% + var(--capOff)); }
.tag {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsTag);
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .68);
  height: calc(var(--fsTag) * 1.25);
  line-height: 1.25;
}
.nm {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsName);
  line-height: 1.16;
  color: #fdf7ee;
  margin: calc(var(--fsTag) * .46) 0 0;
  white-space: nowrap;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--fsRole);
  line-height: 1.24;
  color: rgba(245, 228, 222, .84);
  margin: calc(var(--fsRole) * .22) 0 0;
  white-space: nowrap;
}

/* -------------------------------------------------------------------- foot */
.foot {
  position: absolute;
  bottom: var(--gBot);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.lbl {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsLbl);
  letter-spacing: .34em;
  text-indent: .34em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .62);
  margin: 0;
}
.topic {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--fsTopic);
  line-height: 1.12;
  color: #fdf7ee;
  margin: calc(var(--fsLbl) * .85) 0 0;
}
.topic2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--fsTopic2);
  line-height: 1.26;
  color: rgba(251, 244, 234, .88);
  margin: calc(var(--fsTopic2) * .2) 0 0;
}
.hair {
  width: var(--hairW);
  height: 1px;
  margin: var(--gapHair) auto 0;
  background: linear-gradient(90deg, rgba(201,162,91,0), var(--gold) 26%, var(--gold) 74%, rgba(201,162,91,0));
}
.when {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--whenGap);
  margin-top: var(--gapWhen);
}
.d {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsDate);
  line-height: 1.1;
  letter-spacing: .004em;
  color: #fdf7ee;
}
.v {
  width: 1px;
  height: calc(var(--fsDate) * .72);
  background: rgba(201, 162, 91, .8);
  display: block;
  flex: 0 0 auto;
}
.city {
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--fsCity);
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .86);
}

/* ===================================================================== 9:16 */
html[data-r="9x16"] .canvas {
  --padX: 88px; --gTop: 100px; --gBot: 96px;
  --logoW: 178px; --gapLogo: 44px; --gapHost: 16px;
  --figW: 527px; --figH: 980px; --figOv: 150px;
  --stageTop: 566px; --maskX: 15%; --maskT: 5%; --maskB: 24%;
  --namesTop: 1336px; --capW: 440px; --scrimTop: 1150px;
  --fsTitle: 96px; --fsHost: 47px;
  --fsTag: 17px; --fsName: 40px; --fsRole: 28px;
  --fsLbl: 19px; --fsTopic: 56px; --fsTopic2: 39px;
  --fsDate: 57px; --fsCity: 25px;
  --hairW: 204px; --gapHair: 40px; --gapWhen: 34px; --whenGap: 38px;
}

/* ====================================================================== 4:5 */
html[data-r="4x5"] .canvas {
  --padX: 78px; --gTop: 74px; --gBot: 70px;
  --logoW: 146px; --gapLogo: 30px; --gapHost: 12px;
  --figW: 522px; --figH: 640px; --figOv: 120px;
  --stageTop: 400px; --maskX: 15%; --maskT: 6%; --maskB: 26%;
  --namesTop: 858px; --capW: 434px; --scrimTop: 758px;
  --fsTitle: 78px; --fsHost: 40px;
  --fsTag: 15px; --fsName: 34px; --fsRole: 25px;
  --fsLbl: 16px; --fsTopic: 45px; --fsTopic2: 32px;
  --fsDate: 47px; --fsCity: 21px;
  --hairW: 168px; --gapHair: 28px; --gapWhen: 24px; --whenGap: 30px;
}

/* ====================================================================== 1:1 */
html[data-r="1x1"] .canvas {
  --padX: 72px; --gTop: 66px; --gBot: 66px;
  --logoW: 124px; --gapLogo: 22px; --gapHost: 10px;
  --figW: 543px; --figH: 470px; --figOv: 150px;
  --stageTop: 352px; --maskX: 15%; --maskT: 6%; --maskB: 24%;
  --namesTop: 690px; --capW: 420px; --scrimTop: 596px;
  --fsTitle: 60px; --fsHost: 33px;
  --fsTag: 14px; --fsName: 30px; --fsRole: 22px;
  --fsLbl: 15px; --fsTopic: 38px; --fsTopic2: 27px;
  --fsDate: 41px; --fsCity: 19px;
  --hairW: 140px; --gapHair: 22px; --gapWhen: 20px; --whenGap: 26px;
}
</style>
</head>
<body>
<div class="canvas grain">
  <div class="layer ground"></div>

  <div class="stage">
    <figure class="fig fig--m">
      <span class="fig-in">
        <img class="ph ph--mohinur" src="assets/derived/mohinur-warm.jpg" alt="Mohinur Abdullayeva">
        <span class="tone"></span>
        <span class="veil"></span>
      </span>
    </figure>
    <figure class="fig fig--s">
      <span class="fig-in">
        <img class="ph ph--sarvinoz" src="assets/derived/sarvinoz-warm.jpg" alt="Sarvinoz Alisherovna">
        <span class="tone"></span>
        <span class="veil"></span>
      </span>
    </figure>
  </div>

  <div class="scrim"></div>

  <header class="head">
    <img class="logo" src="assets/logo-cream-trim.png" alt="Diva Women Networking Club">

  <div class="names">

  <footer class="foot">
    <p class="lbl">Uchrashuv mavzusi</p>
    <p class="topic">Shukronalik hissi.</p>

    <div class="hair"></div>
    <div class="when">
      <span class="d num">16-sentabr</span>
      <i class="v"></i>
      <span class="d num">11:00</span>
      <i class="v"></i>
      <span class="city">Toshkent sh.</span>
    </div>
  </footer>
</div>
</body>
</html>
