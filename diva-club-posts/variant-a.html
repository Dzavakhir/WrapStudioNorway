<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant A</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT A — "Modern maroon"
   A deep maroon field; the two women stand large and frameless (background
   removed, the body dissolving into the ground — no ring, no window, no
   photo rectangle); a contemporary centred type grid above and below.
   Ornament budget: one gold hairline mark above the date. Nothing else.
   ======================================================================= */

.canvas {
  background: #5d0416;
  color: var(--cream);
  font-family: var(--serif);

  /* ---------------- geometry (all set per ratio below) ---------------- */
  --padX: 78px;
  --gTop: 74px;
  --gBot: 70px;

  --logoW: 146px;
  --gapLogo: 30px;
  --gapHost: 12px;

  --figW: 560px;            /* photo box width  — drives the figure scale  */
  --figH: 656px;            /* photo box height — drives the crop          */
  --figOv: 196px;           /* how far the two boxes overlap               */
  --stageTop: 452px;
  --stageShift: 17px;       /* centres the pair on the two FACES, not boxes */
  --fadeA: 48%;             /* body fully opaque until here                */
  --fadeB: 82%;             /* body fully dissolved from here              */
  --sinkA: 26%;             /* maroon starts drinking the body here        */
  --sinkM: 58%;

  --namesTop: 866px;
  --capW: 420px;
  --capOff: 154px;
  --scrimTop: 690px;

  /* ---------------- type ---------------- */
  --fsTitle: 78px;  --lhTitle: 1.0;
  --fsHost: 40px;
  --fsTag: 15px;  --fsName: 32px;  --fsRole: 24px;
  --fsLbl: 16px;  --fsTopic: 45px; --fsTopic2: 32px;
  --fsDate: 47px; --fsCity: 21px;
  --markW: 240px; --gapMark: 28px; --gapWhen: 24px; --whenGap: 30px;
}

figure { margin: 0; }

/* ------------------------------------------------------------------ ground */
.ground {
  background:
    radial-gradient(46% 28% at 50% 40%, rgba(234, 198, 186, .15), rgba(234, 198, 186, 0) 72%),
    radial-gradient(118% 62% at 50% -10%, #a01834 0%, #8a0d25 34%, rgba(138, 13, 37, 0) 74%),
    linear-gradient(180deg, #7f0d20 0%, #6d0518 26%, #560314 56%, #3c0210 82%, #2c0210 100%);
}

/* the maroon the lower bodies sink into */
.scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  top: var(--scrimTop);
  background: linear-gradient(180deg,
    rgba(58, 3, 15, 0) 0%,
    rgba(55, 3, 14, .34) 28%,
    rgba(50, 2, 13, .78) 54%,
    rgba(44, 2, 12, .95) 74%,
    #2c0210 100%);
  pointer-events: none;
}

/* ------------------------------------------------------------------- stage */
.stage {
  position: absolute;
  left: 0; right: 0;
  top: var(--stageTop);
  height: var(--figH);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  transform: translateX(var(--stageShift));
}
.fig {
  position: relative;
  flex: 0 0 auto;
  width: var(--figW);
  height: var(--figH);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 var(--fadeA), rgba(0,0,0,0) var(--fadeB));
          mask-image: linear-gradient(180deg, #000 var(--fadeA), rgba(0,0,0,0) var(--fadeB));
}
.fig--s { margin-left: calc(var(--figOv) * -1); }
.fig--m img { filter: brightness(1.05) contrast(1.02); }
.fig--s img { filter: brightness(.97) contrast(1.03) saturate(.88); }

/* the maroon the body is drunk by — clipped to each silhouette (same crop as
   the photo) so the shoulders sink into shadow instead of ghosting out */
.sink {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(60, 3, 16, 0)   var(--sinkA),
    rgba(56, 3, 14, .52) var(--sinkM),
    rgba(50, 2, 13, .93) var(--fadeB),
    rgba(48, 2, 12, 1)  100%);
  -webkit-mask-size: cover;         mask-size: cover;
  -webkit-mask-repeat: no-repeat;   mask-repeat: no-repeat;
}
.fig--m .sink {
  -webkit-mask-image: url("assets/cutout/mohinur-cut-soft.png");
          mask-image: url("assets/cutout/mohinur-cut-soft.png");
  -webkit-mask-position: 50% 16%;   mask-position: 50% 16%;
}
.fig--s .sink {
  -webkit-mask-image: url("assets/cutout/sarvinoz-cut-soft.png");
          mask-image: url("assets/cutout/sarvinoz-cut-soft.png");
  -webkit-mask-position: 46% 14%;   mask-position: 46% 14%;
}

/* -------------------------------------------------------------------- head */
.head {
  position: absolute;
  top: var(--gTop);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.logo { width: var(--logoW); margin: 0 auto; opacity: .95; }
.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsTitle);
  line-height: var(--lhTitle);
  letter-spacing: -.018em;
  color: #fdf7ee;
  margin: var(--gapLogo) 0 0;
}
.host {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--fsHost);
  line-height: 1.2;
  color: var(--gold-soft);
  margin: var(--gapHost) 0 0;
}

/* ------------------------------------------------------------------- names */
.names { position: absolute; top: var(--namesTop); left: 0; right: 0; height: 0; }
.cap {
  position: absolute;
  top: 0;
  width: var(--capW);
  transform: translateX(-50%);
  text-align: center;
}
.cap--l { left: calc(50% - var(--capOff)); }
.cap--r { left: calc(50% + var(--capOff)); }
.tag {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsTag);
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .7);
  height: calc(var(--fsTag) * 1.25);
  line-height: 1.25;
}
.nm {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsName);
  line-height: 1.14;
  letter-spacing: -.004em;
  color: #fdf7ee;
  margin: calc(var(--fsTag) * .8) 0 0;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--fsRole);
  line-height: 1.24;
  color: rgba(245, 228, 222, .86);
  margin: calc(var(--fsRole) * .3) 0 0;
  white-space: nowrap;
}

/* -------------------------------------------------------------------- foot */
.foot {
  position: absolute;
  bottom: var(--gBot);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.lbl {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsLbl);
  letter-spacing: .34em;
  text-indent: .34em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .62);
  margin: 0;
}
.topic {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--fsTopic);
  line-height: 1.12;
  color: #fdf7ee;
  margin: calc(var(--fsLbl) * .85) 0 0;
}
.topic2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--fsTopic2);
  line-height: 1.26;
  color: rgba(251, 244, 234, .88);
  margin: calc(var(--fsTopic2) * .2) 0 0;
}
/* the post's single ornament */
.mark {
  width: var(--markW);
  height: calc(var(--markW) * 16 / 600);
  margin: var(--gapMark) auto 0;
  -webkit-mask: url("assets/orn/mark-rule-dot.svg") center/contain no-repeat;
          mask: url("assets/orn/mark-rule-dot.svg") center/contain no-repeat;
  background: var(--gold);
}
.when {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--whenGap);
  margin-top: var(--gapWhen);
}
.d {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsDate);
  line-height: 1.1;
  letter-spacing: .004em;
  color: #fdf7ee;
}
.v {
  width: 1px;
  height: calc(var(--fsDate) * .7);
  background: rgba(201, 162, 91, .8);
  display: block;
  flex: 0 0 auto;
}
.city {
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--fsCity);
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .86);
}

/* ===================================================================== 9:16 */
html[data-r="9x16"] .canvas {
  --padX: 88px; --gTop: 100px; --gBot: 96px;
  --logoW: 190px; --gapLogo: 44px; --gapHost: 16px;
  --figW: 562px; --figH: 830px; --figOv: 220px;
  --stageTop: 566px; --stageShift: 17px;
  --fadeA: 64%; --fadeB: 92%; --sinkA: 36%; --sinkM: 68%;
  --namesTop: 1300px; --capW: 420px; --capOff: 143px; --scrimTop: 1040px;
  --fsTitle: 102px; --fsHost: 47px;
  --fsTag: 17px; --fsName: 40px; --fsRole: 28px;
  --fsLbl: 19px; --fsTopic: 56px; --fsTopic2: 39px;
  --fsDate: 57px; --fsCity: 25px;
  --markW: 300px; --gapMark: 40px; --gapWhen: 34px; --whenGap: 38px;
}

/* ====================================================================== 4:5 */
html[data-r="4x5"] .canvas {
  --padX: 78px; --gTop: 74px; --gBot: 70px;
  --logoW: 152px; --gapLogo: 30px; --gapHost: 12px;
  --figW: 560px; --figH: 656px; --figOv: 196px;
  --stageTop: 452px; --stageShift: 17px;
  --fadeA: 48%; --fadeB: 82%; --sinkA: 26%; --sinkM: 58%;
  --namesTop: 866px; --capW: 420px; --capOff: 154px; --scrimTop: 690px;
  --fsTitle: 78px; --fsHost: 40px;
  --fsTag: 15px; --fsName: 32px; --fsRole: 24px;
  --fsLbl: 16px; --fsTopic: 45px; --fsTopic2: 32px;
  --fsDate: 47px; --fsCity: 21px;
  --markW: 240px; --gapMark: 24px; --gapWhen: 22px; --whenGap: 30px;
}

/* ====================================================================== 1:1 */
html[data-r="1x1"] .canvas {
  --padX: 72px; --gTop: 62px; --gBot: 60px;
  --logoW: 124px; --gapLogo: 20px; --gapHost: 8px;
  --figW: 567px; --figH: 660px; --figOv: 198px;
  --stageTop: 358px; --stageShift: 17px;
  --fadeA: 32%; --fadeB: 66%; --sinkA: 14%; --sinkM: 44%;
  --namesTop: 656px; --capW: 400px; --capOff: 156px; --scrimTop: 520px;
  --fsTitle: 60px; --fsHost: 33px;
  --fsTag: 14px; --fsName: 29px; --fsRole: 22px;
  --fsLbl: 15px; --fsTopic: 38px; --fsTopic2: 27px;
  --fsDate: 41px; --fsCity: 19px;
  --markW: 190px; --gapMark: 22px; --gapWhen: 20px; --whenGap: 26px;
}
</style>
</head>
<body>
<div class="canvas grain">
  <div class="layer ground"></div>

  <div class="stage">
    <figure class="fig fig--m">
      <img class="ph ph--mohinur" src="assets/cutout/mohinur-cut-soft.png" alt="Mohinur Abdullayeva">
      <span class="sink"></span>
    </figure>
    <figure class="fig fig--s">
      <img class="ph ph--sarvinoz" src="assets/cutout/sarvinoz-cut-soft.png" alt="Sarvinoz Alisherovna">
      <span class="sink"></span>
    </figure>
  </div>

  <div class="scrim"></div>

  <header class="head">
    <img class="logo" src="assets/logo-cream-trim.png" alt="Diva Women Networking Club">
    <h1 class="title">Diva klubi<br>uchrashuvi</h1>
    <p class="host">Mohinur Abdullayeva bilan</p>
  </header>

  <div class="names">
    <div class="cap cap--l">
      <div class="tag"></div>
      <div class="nm">Mohinur<br>Abdullayeva</div>
    </div>
    <div class="cap cap--r">
      <div class="tag">Mehmon spiker</div>
      <div class="nm">Sarvinoz<br>Alisherovna</div>
      <div class="role">psixolog, vrach psixoterapevt</div>
    </div>
  </div>

  <footer class="foot">
    <p class="lbl">Uchrashuv mavzusi</p>
    <p class="topic">Shukronalik hissi.</p>
    <p class="topic2">1 ta katta maqsad uchun ongni tayyorlash</p>
    <div class="mark"></div>
    <div class="when">
      <span class="d num">16-sentabr</span>
      <i class="v"></i>
      <span class="d num">11:00</span>
      <i class="v"></i>
      <span class="city">Toshkent sh.</span>
    </div>
  </footer>
</div>
</body>
</html>
