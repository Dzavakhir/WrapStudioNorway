<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant A</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT A — "Modern maroon"
   Deep maroon field, two women placed large and frameless (soft photographic
   dissolve, no rings / no cut-out rectangle), contemporary centred type grid.
   Decoration budget: one gold hairline + one gold rule. Nothing else.
   ======================================================================= */

.canvas {
  background: #5d0416;
  color: var(--cream);
  font-family: var(--serif);

  /* --- geometry (overridden per ratio) --- */
  --padX: 78px;
  --gTop: 74px;
  --gBot: 74px;

  --logoW: 144px;

  --figW: 538px;
  --figH: 880px;
  --figOv: 152px;      /* horizontal overlap between the two boxes */
  --stageTop: 370px;
  --maskX: 15%;        /* side dissolve */
  --maskT: 11%;        /* top dissolve */
  --maskB: 26%;        /* bottom dissolve */

  --namesTop: 958px;
  --capW: 432px;
  --scrimTop: 840px;

  /* --- type --- */
  --fsTitle: 76px;
  --lhTitle: 1.0;
  --fsHost: 40px;
  --fsTag: 15px;
  --fsName: 34px;
  --fsRole: 25px;
  --fsLbl: 16px;
  --fsTopic: 44px;
  --fsTopic2: 31px;
  --fsDate: 46px;
  --fsCity: 21px;
}

/* ------------------------------------------------------------------ ground */
.ground {
  background:
    radial-gradient(58% 34% at 50% 40%, rgba(226, 178, 168, .13), transparent 72%),
    radial-gradient(112% 62% at 50% -6%, #9c1430 0%, #850b22 30%, rgba(133, 11, 34, 0) 70%),
    linear-gradient(180deg, #7d0a1e 0%, #6c0519 30%, #560314 60%, #3e0210 84%, #2f020c 100%);
}

/* scrim that swallows the lower half of the figures */
.scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  top: var(--scrimTop);
  background: linear-gradient(180deg,
    rgba(58, 3, 15, 0) 0%,
    rgba(56, 3, 14, .42) 24%,
    rgba(51, 2, 13, .86) 50%,
    rgba(45, 2, 12, .98) 70%,
    #2f020c 100%);
  pointer-events: none;
}

/* ------------------------------------------------------------------- stage */
.stage {
  position: absolute;
  left: 0; right: 0;
  top: var(--stageTop);
  height: var(--figH);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: calc(var(--figOv) * -1);
}
.fig {
  position: relative;
  flex: 0 0 auto;
  width: var(--figW);
  height: var(--figH);
  /* vertical dissolve */
  -webkit-mask-image: linear-gradient(180deg,
      rgba(0,0,0,0) 0%, #000 var(--maskT),
      #000 calc(100% - var(--maskB)), rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(180deg,
      rgba(0,0,0,0) 0%, #000 var(--maskT),
      #000 calc(100% - var(--maskB)), rgba(0,0,0,0) 100%);
}
.fig-in {
  position: absolute;
  inset: 0;
  overflow: hidden;
  /* horizontal dissolve */
  -webkit-mask-image: linear-gradient(90deg,
      rgba(0,0,0,0) 0%, #000 var(--maskX),
      #000 calc(100% - var(--maskX)), rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(90deg,
      rgba(0,0,0,0) 0%, #000 var(--maskX),
      #000 calc(100% - var(--maskX)), rgba(0,0,0,0) 100%);
}
.fig-in img { filter: saturate(.96) contrast(1.03) brightness(1.02); }

/* maroon grade that pulls each frame's own background into the ground
   before the mask fades it out — no halo, no visible photo edge. */
.tone {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(56% 46% at 50% 31%,
      rgba(96, 6, 24, 0) 26%,
      rgba(88, 5, 21, .34) 52%,
      rgba(72, 4, 18, .80) 76%,
      rgba(58, 3, 14, .96) 100%);
}
.tone::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(58,3,14,0) 46%, rgba(52,2,13,.62) 78%, rgba(47,2,12,.92) 100%);
}
.fig--s .tone {
  background:
    radial-gradient(52% 42% at 48% 28%,
      rgba(104, 8, 26, 0) 20%,
      rgba(96, 6, 23, .40) 46%,
      rgba(78, 4, 19, .86) 72%,
      rgba(58, 3, 14, .98) 100%);
}

/* -------------------------------------------------------------------- head */
.head {
  position: absolute;
  top: var(--gTop);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.logo {
  width: var(--logoW);
  margin: 0 auto;
  opacity: .95;
}
.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsTitle);
  line-height: var(--lhTitle);
  letter-spacing: -.018em;
  color: #fdf7ee;
  margin: var(--gapLogo, 28px) 0 0;
}
.host {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--fsHost);
  line-height: 1.2;
  color: var(--gold-soft);
  margin: var(--gapHost, 14px) 0 0;
}

/* ------------------------------------------------------------------- names */
.names {
  position: absolute;
  top: var(--namesTop);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: calc(var(--figW) - var(--figOv) - var(--capW));
  text-align: center;
}
.cap { width: var(--capW); }
.tag {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsTag);
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .66);
  height: calc(var(--fsTag) * 1.2);
  line-height: 1.2;
}
.nm {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsName);
  line-height: 1.16;
  color: #fdf7ee;
  margin: calc(var(--fsTag) * .42) 0 0;
  white-space: nowrap;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--fsRole);
  line-height: 1.24;
  color: rgba(244, 227, 221, .82);
  margin: calc(var(--fsRole) * .2) 0 0;
}

/* -------------------------------------------------------------------- foot */
.foot {
  position: absolute;
  bottom: var(--gBot);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.lbl {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsLbl);
  letter-spacing: .34em;
  text-indent: .34em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .6);
  margin: 0;
}
.topic {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--fsTopic);
  line-height: 1.12;
  letter-spacing: .002em;
  color: #fdf7ee;
  margin: calc(var(--fsLbl) * .8) 0 0;
}
.topic2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--fsTopic2);
  line-height: 1.26;
  color: rgba(251, 244, 234, .88);
  margin: calc(var(--fsTopic2) * .18) 0 0;
}
.hair {
  width: var(--hairW, 168px);
  height: 1px;
  margin: var(--gapHair, 30px) auto 0;
  background: linear-gradient(90deg, rgba(201,162,91,0), var(--gold) 26%, var(--gold) 74%, rgba(201,162,91,0));
}
.when {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--whenGap, 30px);
  margin-top: var(--gapWhen, 26px);
}
.d {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsDate);
  line-height: 1.1;
  letter-spacing: .004em;
  color: #fdf7ee;
}
.v {
  width: 1px;
  height: calc(var(--fsDate) * .74);
  background: rgba(201, 162, 91, .78);
  display: block;
  flex: 0 0 auto;
}
.city {
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--fsCity);
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .84);
}

/* ===================================================================== 9:16 */
html[data-r="9x16"] .canvas {
  --padX: 88px;  --gTop: 104px; --gBot: 100px;
  --logoW: 178px; --gapLogo: 42px; --gapHost: 16px;
  --figW: 538px; --figH: 1010px; --figOv: 140px;
  --stageTop: 524px; --maskX: 15%; --maskT: 9%; --maskB: 24%;
  --namesTop: 1372px; --capW: 440px; --scrimTop: 1180px;
  --fsTitle: 96px; --lhTitle: 1.0; --fsHost: 47px;
  --fsTag: 17px; --fsName: 40px; --fsRole: 28px;
  --fsLbl: 19px; --fsTopic: 55px; --fsTopic2: 39px;
  --fsDate: 56px; --fsCity: 25px;
  --hairW: 200px; --gapHair: 40px; --gapWhen: 34px; --whenGap: 38px;
}

/* ====================================================================== 4:5 */
html[data-r="4x5"] .canvas {
  --padX: 78px;  --gTop: 74px;  --gBot: 74px;
  --logoW: 146px; --gapLogo: 28px; --gapHost: 12px;
  --figW: 538px; --figH: 880px; --figOv: 152px;
  --stageTop: 372px; --maskX: 15%; --maskT: 11%; --maskB: 27%;
  --namesTop: 952px; --capW: 434px; --scrimTop: 856px;
  --fsTitle: 76px; --lhTitle: 1.0; --fsHost: 40px;
  --fsTag: 15px; --fsName: 34px; --fsRole: 25px;
  --fsLbl: 16px; --fsTopic: 45px; --fsTopic2: 32px;
  --fsDate: 47px; --fsCity: 21px;
  --hairW: 168px; --gapHair: 28px; --gapWhen: 24px; --whenGap: 30px;
}

/* ====================================================================== 1:1 */
html[data-r="1x1"] .canvas {
  --padX: 72px;  --gTop: 68px;  --gBot: 68px;
  --logoW: 122px; --gapLogo: 20px; --gapHost: 8px;
  --figW: 534px; --figH: 520px; --figOv: 140px;
  --stageTop: 344px; --maskX: 15%; --maskT: 9%; --maskB: 24%;
  --namesTop: 706px; --capW: 420px; --scrimTop: 630px;
  --fsTitle: 60px; --lhTitle: 1.0; --fsHost: 33px;
  --fsTag: 14px; --fsName: 30px; --fsRole: 22px;
  --fsLbl: 15px; --fsTopic: 38px; --fsTopic2: 27px;
  --fsDate: 41px; --fsCity: 19px;
  --hairW: 140px; --gapHair: 22px; --gapWhen: 20px; --whenGap: 26px;
}
</style>
</head>
<body>
<div class="canvas grain">
  <div class="layer ground"></div>

  <div class="stage">
    <figure class="fig fig--m">
      <span class="fig-in">
        <img class="ph ph--mohinur" src="assets/derived/mohinur-warm.jpg" alt="Mohinur Abdullayeva">
        <span class="tone"></span>
      </span>
    </figure>
    <figure class="fig fig--s">
      <span class="fig-in">
        <img class="ph ph--sarvinoz" src="assets/derived/sarvinoz-warm.jpg" alt="Sarvinoz Alisherovna">

  </div>

  <div class="scrim"></div>

  <header class="head">
    <img class="logo" src="assets/logo-cream-trim.png" alt="Diva Women Networking Club">

  <div class="names">
    <div class="cap">
      <div class="tag"></div>

    </div>
    <div class="cap">
      <div class="tag">Mehmon spiker</div>

    </div>
  </div>

  <footer class="foot">
    <p class="lbl">Uchrashuv mavzusi</p>
    <p class="topic">Shukronalik hissi.</p>
    <p class="topic2">1 ta katta maqsad uchun ongni tayyorlash</p>
    <div class="hair"></div>
    <div class="when">
      <span class="d num">16-sentabr</span>
      <i class="v"></i>
      <span class="d num">11:00</span>
      <i class="v"></i>
      <span class="city">Toshkent sh.</span>
    </div>
  </footer>
</div>
</body>
</html>
