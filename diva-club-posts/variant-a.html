<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant A</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT A — "Romantik klassik"
   Deep maroon ground, gold double frame, two gold-ringed portraits,
   Playfair display type. Formal, ceremonial, invitation-like.
   ======================================================================= */

.canvas {
  background:
    radial-gradient(120% 80% at 50% 8%, #9b0a24 0%, #7a0519 42%, #4d0311 100%);
  color: var(--cream);
  font-family: var(--serif);
  --u: 1;            /* type scale */
  --photo: 318px;    /* portrait diameter */
  --gapy: 1;         /* vertical rhythm multiplier */
}
html[data-r="9x16"] .canvas { --u: 1.06; --photo: 356px; --gapy: 1.75; }
html[data-r="4x5"]  .canvas { --u: 0.93; --photo: 292px; --gapy: 0.72; }
html[data-r="1x1"]  .canvas { --u: 0.84; --photo: 240px; --gapy: 0.34; }

/* ---------- atmosphere ---------- */
.glow {
  position: absolute;
  width: 140%; height: 60%;
  left: -20%; top: -22%;
  background: radial-gradient(50% 50% at 50% 50%, rgba(255, 214, 170, 0.20), transparent 70%);
}
.vign {
  position: absolute; inset: 0;
  background: radial-gradient(105% 78% at 50% 44%, transparent 45%, rgba(30, 1, 8, 0.72) 100%);
}
.orn-corner {
  position: absolute;
  width: calc(196px * var(--u)); height: calc(196px * var(--u));
  -webkit-mask: url("assets/orn/corner.svg") center/contain no-repeat;
  background: var(--gold);
  opacity: 0.4;
}
.orn-corner.tl { top: calc(54px * var(--u)); left: calc(54px * var(--u)); }
.orn-corner.br { bottom: calc(54px * var(--u)); right: calc(54px * var(--u)); transform: rotate(180deg); }

/* ---------- frame ---------- */
.frame {
  position: absolute;
  inset: calc(38px * var(--u));
  border: 1px solid rgba(201, 162, 91, 0.75);
}
.frame::after {
  content: "";
  position: absolute;
  inset: calc(9px * var(--u));
  border: 2px solid rgba(201, 162, 91, 0.32);
}

/* ---------- content column ---------- */
.content {
  position: absolute;
  inset: calc(38px * var(--u) + 26px) var(--pad) calc(38px * var(--u) + 22px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  text-align: center;
}

.logo-lockup {
  width: calc(238px * var(--u));
  margin-bottom: calc(30px * var(--gapy) + 16px);
  filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.25));
}

.kicker {
  font-family: var(--sans);
  font-size: calc(17px * var(--u));
  font-weight: 400;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-bottom: calc(16px * var(--u));
  text-indent: 0.42em;
}

.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: calc(80px * var(--u));
  line-height: 1.02;
  letter-spacing: -0.012em;
  margin: 0;
  color: #fdf6ec;
}

.with {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: calc(46px * var(--u));
  color: var(--gold-soft);
  margin-top: calc(10px * var(--u));
  letter-spacing: 0.005em;
}

.flourish {
  width: calc(430px * var(--u));
  height: calc(44px * var(--u));
  -webkit-mask: url("assets/orn/flourish.svg") center/contain no-repeat;
  background: linear-gradient(90deg, rgba(201,162,91,0.2), var(--gold) 30%, var(--gold-soft) 50%, var(--gold) 70%, rgba(201,162,91,0.2));
  margin: calc(16px * var(--gapy) + 14px) 0 calc(18px * var(--gapy) + 16px);
}

/* ---------- portraits ---------- */
.people {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: calc(54px * var(--u));
}
.person { width: var(--photo); }
.pic {
  position: relative;
  width: var(--photo);
  height: var(--photo);
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--gold);
  box-shadow:
    0 0 0 calc(9px * var(--u)) rgba(201, 162, 91, 0.13),
    0 26px 48px rgba(28, 1, 7, 0.5);
}
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(147, 6, 31, 0.05), rgba(77, 3, 17, 0.35));
}
.cap { margin-top: calc(22px * var(--u)); }
.cap-role-top {
  font-family: var(--sans);
  font-size: calc(15px * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: calc(7px * var(--u));
  text-indent: 0.3em;
}
.cap-name {
  font-family: var(--display);
  font-weight: 500;
  font-size: calc(31px * var(--u));
  line-height: 1.15;
  color: #fdf6ec;
}
.cap-role {
  font-family: var(--serif);
  font-style: italic;
  font-size: calc(26px * var(--u));
  line-height: 1.25;
  color: #e6bfc0;
  margin-top: calc(4px * var(--u));
}

/* ---------- theme ---------- */
.theme { margin-top: calc(26px * var(--gapy) + 20px); max-width: calc(860px * var(--u)); }
.theme-label {
  font-family: var(--sans);
  font-size: calc(16px * var(--u));
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold);
  text-indent: 0.34em;
}
.theme-text {
  font-family: var(--serif);
  font-weight: 500;
  font-size: calc(42px * var(--u));
  line-height: 1.24;
  color: #fdf6ec;
  margin-top: calc(12px * var(--u));
}

/* ---------- date bar ---------- */
.when {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(22px * var(--u));
  padding: calc(16px * var(--u)) calc(38px * var(--u));
  border: 1px solid rgba(201, 162, 91, 0.6);
  background: rgba(45, 2, 11, 0.32);
}
.when-date {
  font-family: var(--display);
  font-weight: 500;
  font-size: calc(38px * var(--u));
  color: #fdf6ec;
  letter-spacing: 0.01em;
}
.when-sep { width: calc(7px * var(--u)); height: calc(7px * var(--u)); transform: rotate(45deg); background: var(--gold); }
.when-meta {
  font-family: var(--sans);
  font-size: calc(24px * var(--u));
  font-weight: 300;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold-soft);
}
.when-wrap { margin-top: auto; padding-bottom: calc(6px * var(--u)); }
</style>
</head>
<body>
<div class="canvas grain">
  <div class="layer glow"></div>
  <div class="layer vign"></div>
  <div class="frame"></div>
  <div class="orn-corner tl"></div>
  <div class="orn-corner br"></div>

  <div class="content">
    <img class="logo-lockup" src="assets/logo-cream-trim.png" alt="Diva Women Networking Club">

    <h1 class="title">Diva klubi<br>uchrashuvi</h1>
    <div class="with">Mohinur Abdullayeva bilan</div>

    <div class="flourish"></div>

    <div class="people">
      <div class="person">
        <div class="pic"><img class="ph ph--mohinur" src="assets/mohinur.jpg" alt="Mohinur Abdullayeva"></div>
        <div class="cap">
          <div class="cap-name">Mohinur<br>Abdullayeva</div>
        </div>
      </div>
      <div class="person">
        <div class="pic"><img class="ph ph--sarvinoz" src="assets/sarvinoz.jpg" alt="Sarvinoz Alisherovna"></div>
        <div class="cap">
          <div class="cap-role-top">Mehmon spiker</div>
          <div class="cap-name">Sarvinoz<br>Alisherovna</div>
          <div class="cap-role">psixolog, vrach psixoterapevt</div>
        </div>
      </div>
    </div>

    <div class="theme">
      <div class="theme-label">Uchrashuv mavzusi</div>
      <div class="theme-text">Shukronalik hissi.<br>1 ta katta maqsad uchun ongni tayyorlash</div>
    </div>

    <div class="when-wrap">
      <div class="when">
        <span class="when-date num">16-sentabr</span>
        <span class="when-sep"></span>
        <span class="when-date num">11:00</span>
        <span class="when-sep"></span>
        <span class="when-meta">Toshkent sh.</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
