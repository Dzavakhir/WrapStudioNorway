<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant A</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT A — "Modern maroon"
   A deep maroon field; the two women stand large and frameless (background
   removed, the body dissolving into the ground — no ring, no window, no
   photo rectangle); a contemporary centred type grid above and below.
   Ornament budget: one gold hairline mark above the date. Nothing else.
   ======================================================================= */

.canvas {
  background: #5d0416;
  color: var(--cream);
  font-family: var(--serif);

  /* ---------------- geometry (all set per ratio below) ---------------- */
  --padX: 78px;
  --gTop: 74px;
  --gBot: 70px;

  --logoW: 146px;
  --gapLogo: 30px;
  --gapHost: 12px;

  --figW: 560px;            /* Mohinur's box width — drives the figure scale */
  --figWs: var(--figW);     /* Sarvinoz's box width — narrower crops her hair */
  --figH: 656px;            /* photo box height — drives the crop          */
  --figOv: 196px;           /* how far the two boxes overlap               */
  --stageTop: 452px;
  --stageShift: 17px;       /* centres the pair on the two FACES, not boxes */
  --maskX: 6%;              /* softener where a silhouette runs out of frame */
  --fadeA: 48%;             /* body fully opaque until here                */
  --fadeB: 82%;             /* body fully dissolved from here              */
  /* The dissolve must never reach a face. Chins measured off the renders and
     carried back to the source frame (1717x2576): Mohinur's jaw bottoms out at
     source y≈1141, Sarvinoz rests her chin on her hand and that hand bottoms
     out at y≈1000. Both --sinkA/--sinkAs and --scrimTop are always set BELOW
     the rendered y of those two — see each ratio block for the arithmetic. */
  --sinkA: 52%;             /* maroon starts drinking the body here        */
  --sinkM: 66%;
  --sinkE: 82%;             /* body essentially all maroon from here       */
  /* Sarvinoz wears white: her blouse needs the maroon earlier and harder than
     Mohinur's dark gown, or the caption band under her sits on a blotchy tail. */
  --sinkAs: var(--sinkA);
  --sinkMs: var(--sinkM);
  --sinkEs: var(--sinkE);

  --namesTop: 866px;
  --capW: 420px;
  --capOff: 154px;
  --scrimTop: 800px;
  --scrimOp: 1;
  --gapCity: 12px;

  /* ---------------- type ---------------- */
  --fsTitle: 78px;  --lhTitle: 1.0;
  --fsHost: 40px;
  --fsTag: 15px;  --fsName: 32px;  --fsRole: 24px;
  --fsLbl: 16px;  --fsTopic: 45px; --fsTopic2: 32px;
  --fsDate: 47px; --fwDate: 600; --fsCity: 21px;
  --markW: 240px; --gapMark: 28px; --gapWhen: 24px; --whenGap: 30px;
}

figure { margin: 0; }

/* ------------------------------------------------------------------ ground */
.ground {
  background:
    radial-gradient(46% 28% at 50% 40%, rgba(234, 198, 186, .15), rgba(234, 198, 186, 0) 72%),
    radial-gradient(118% 62% at 50% -10%, #a01834 0%, #8a0d25 34%, rgba(138, 13, 37, 0) 74%),
    linear-gradient(180deg, #7f0d20 0%, #6d0518 26%, #560314 56%, #3c0210 82%, #2c0210 100%);
}

/* The maroon the lower bodies sink into. It starts below the lower of the two
   chins (see --scrimTop) and then rises quickly, so the caption band always
   has a dark bed without any shadow ever reaching a face. */
.scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  top: var(--scrimTop);
  opacity: var(--scrimOp);
  background: linear-gradient(180deg,
    rgba(58, 3, 15, 0) 0%,
    rgba(56, 3, 14, .36) 15%,
    rgba(50, 2, 13, .76) 45%,
    rgba(44, 2, 12, .88) 70%,
    rgba(40, 2, 11, .92) 100%);
  pointer-events: none;
}

/* focuses the eye on the two faces and keeps bright cloth off the edges */
.vig {
  background: radial-gradient(82% 56% at 50% 40%,
    rgba(26, 1, 8, 0) 50%, rgba(26, 1, 8, .16) 76%, rgba(22, 1, 7, .40) 100%);
}

/* ------------------------------------------------------------------- stage */
.stage {
  position: absolute;
  left: 0; right: 0;
  top: var(--stageTop);
  height: var(--figH);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  transform: translateX(var(--stageShift));
}
.fig {
  position: relative;
  flex: 0 0 auto;
  width: var(--figW);
  height: var(--figH);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 var(--fadeA), rgba(0,0,0,0) var(--fadeB));
          mask-image: linear-gradient(180deg, #000 var(--fadeA), rgba(0,0,0,0) var(--fadeB));
}
.fig--s { width: var(--figWs); margin-left: calc(var(--figOv) * -1); }
/* softens the one place a silhouette runs out of its own frame (the hem of
   Mohinur's gown) so no straight cut ever shows against the ground */
.fig-in {
  position: absolute;
  inset: 0;
  -webkit-mask-image: linear-gradient(90deg,
      rgba(0,0,0,0) 0%, #000 var(--maskX), #000 calc(100% - var(--maskX)), rgba(0,0,0,0) 100%);
          mask-image: linear-gradient(90deg,
      rgba(0,0,0,0) 0%, #000 var(--maskX), #000 calc(100% - var(--maskX)), rgba(0,0,0,0) 100%);
}
.fig--m img { filter: brightness(1.05) contrast(1.02); }
.fig--s img { filter: brightness(.97) contrast(1.03) saturate(.88); }

/* the maroon the body is drunk by — clipped to each silhouette (same crop as
   the photo) so the shoulders sink into shadow instead of ghosting out */
.sink {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(60, 3, 16, 0)   var(--sinkA),
    rgba(57, 3, 15, .62) var(--sinkM),
    rgba(50, 2, 13, .93) var(--sinkE),
    rgba(48, 2, 12, .96) 100%);
  -webkit-mask-size: cover;         mask-size: cover;
  -webkit-mask-repeat: no-repeat;   mask-repeat: no-repeat;
}
.fig--s .sink {
  background: linear-gradient(180deg,
    rgba(60, 3, 16, 0)   var(--sinkAs),
    rgba(57, 3, 15, .80) var(--sinkMs),
    rgba(50, 2, 13, .97) var(--sinkEs),
    rgba(48, 2, 12, .99) 100%);
}
.fig--m .sink {
  -webkit-mask-image: url("assets/cutout/mohinur-cut-soft.png");
          mask-image: url("assets/cutout/mohinur-cut-soft.png");
  -webkit-mask-position: 50% 16%;   mask-position: 50% 16%;
}
.fig--s .sink {
  -webkit-mask-image: url("assets/cutout/sarvinoz-cut-soft.png");
          mask-image: url("assets/cutout/sarvinoz-cut-soft.png");
  -webkit-mask-position: 46% 14%;   mask-position: 46% 14%;
}

/* -------------------------------------------------------------------- head */
.head {
  position: absolute;
  top: var(--gTop);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.logo { width: var(--logoW); margin: 0 auto; opacity: .95; }
.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsTitle);
  line-height: var(--lhTitle);
  letter-spacing: -.018em;
  color: #fdf7ee;
  margin: var(--gapLogo) 0 0;
}
.host {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--fsHost);
  line-height: 1.2;
  color: var(--gold-soft);
  margin: var(--gapHost) 0 0;
}

/* ------------------------------------------------------------------- names */
.names { position: absolute; top: var(--namesTop); left: 0; right: 0; height: 0; }
.cap {
  position: absolute;
  top: 0;
  width: var(--capW);
  transform: translateX(-50%);
  text-align: center;
}
.cap--l { left: calc(50% - var(--capOff)); }
.cap--r { left: calc(50% + var(--capOff)); }
.tag {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsTag);
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .7);
  height: calc(var(--fsTag) * 1.25);
  line-height: 1.25;
}
.nm {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--fsName);
  line-height: 1.14;
  letter-spacing: -.004em;
  color: #fdf7ee;
  margin: calc(var(--fsTag) * .8) 0 0;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--fsRole);
  line-height: 1.24;
  color: rgba(245, 228, 222, .86);
  margin: calc(var(--fsRole) * .3) 0 0;
  white-space: nowrap;
}

/* -------------------------------------------------------------------- foot */
.foot {
  position: absolute;
  bottom: var(--gBot);
  left: var(--padX);
  right: var(--padX);
  text-align: center;
}
.lbl {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--fsLbl);
  letter-spacing: .34em;
  text-indent: .34em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .62);
  margin: 0;
}
.topic {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--fsTopic);
  line-height: 1.12;
  color: #fdf7ee;
  margin: calc(var(--fsLbl) * .85) 0 0;
}
.topic2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--fsTopic2);
  line-height: 1.26;
  color: rgba(251, 244, 234, .88);
  margin: calc(var(--fsTopic2) * .2) 0 0;
}
/* the post's single ornament */
.mark {
  width: var(--markW);
  height: calc(var(--markW) * 16 / 600);
  margin: var(--gapMark) auto 0;
  -webkit-mask: url("assets/orn/mark-rule-dot.svg") center/contain no-repeat;
          mask: url("assets/orn/mark-rule-dot.svg") center/contain no-repeat;
  background: var(--gold);
}
/* 4:5 and 1:1 stack the venue under the date; 9:16 sets the whole thing as one
   band (see that block) so the Story's strongest bottom line is a single row. */
.whenwrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: var(--gapWhen);
}
.when {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--whenGap);
}
.d {
  font-family: var(--display);
  font-weight: var(--fwDate);
  font-size: var(--fsDate);
  line-height: 1.1;
  letter-spacing: .004em;
  color: #fdf7ee;
}
.v {
  width: 1px;
  height: calc(var(--fsDate) * .7);
  background: rgba(201, 162, 91, .8);
  display: block;
  flex: 0 0 auto;
}
/* the second rule only exists when the venue rides in the date band (9:16) */
.v--city { display: none; }
.city {
  display: block;
  margin: var(--gapCity) 0 0;
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--fsCity);
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: rgba(251, 244, 234, .86);
}

/* ===================================================================== 9:16
   A 9:16 post is read as a Story: the platform paints its own UI over roughly
   the top 140px and the bottom 250px of the 1080x1920 frame, so the venue line
   has to stop above y1670 and a deep foot margin is unavoidable. The answer is
   not to fight it but to MATCH it at the top — the head block starts at 232 so
   the two end margins read as a pair (232 / 258) rather than as a poster that
   slid up the frame — and to buy the height back out of the type stack, which
   is where the figures' extra 22% comes from.

   Geometry, all measured rather than guessed (source frame 1717x2576):
     figH 1262 > 1.5 x figW, so COVER is height-driven: scale k = 1262/2576
     = 0.4899 (the old pair ran at 0.4018 — faces are 22% larger).
     Mohinur's box 700 wide, Sarvinoz's 620: the narrower box crops the outer
     6% of her hair sweep, which is what used to force the pair to stay small.
     pair = 700 + 620 - 231 = 1089 wide, centred then nudged -5 -> her box
     right lands exactly on x1080, so the hair dissolves into the edge, and
     Mohinur's fade runs out at x0. The pair now spans the full width.
     hair top 608 | Mohinur chin 1116 | Sarvinoz hand 1047 | stage foot 1819 */
html[data-r="9x16"] .canvas {
  --padX: 88px; --gTop: 232px; --gBot: 248px;
  --logoW: 132px; --gapLogo: 20px; --gapHost: 6px;
  --figW: 700px; --figWs: 620px; --figH: 1262px; --figOv: 231px;
  --stageTop: 557px; --stageShift: -5px; --maskX: 9%;
  /* Measured on the render: Mohinur's jaw bottoms at y1116 = 44.3% of the box,
     Sarvinoz's chin rests on her hand and that hand bottoms at y1047 = 38.8%.
     Her sink opens at 39.5% (y1055) and his at 47% (y1150) — both under their
     own faces. The bodies then stay at FULL alpha and are simply sunk, so the
     caption band gets one even ground instead of a half-dissolved blouse; only
     the last 14% of the box tapers, so no cut edge shows anywhere. */
  --fadeA: 86%; --fadeB: 100%;
  --sinkA: 47%; --sinkM: 51.5%; --sinkE: 56%;
  --sinkAs: 39.5%; --sinkMs: 45%; --sinkEs: 50%;
  --namesTop: 1215px; --capW: 420px; --capOff: 168px;
  --scrimTop: 1130px; --scrimOp: .62;
  --fsTitle: 90px; --lhTitle: .96; --fsHost: 42px;
  --fsTag: 21px; --fsName: 34px; --fsRole: 26px;
  --fsLbl: 22px; --fsTopic: 56px; --fsTopic2: 36px;
  --fsDate: 68px; --fsCity: 27px;
  --markW: 400px; --gapMark: 12px; --gapWhen: 12px; --whenGap: 30px;
}
/* one band: 16-sentabr | 11:00 | TOSHKENT SH. */
html[data-r="9x16"] .whenwrap { flex-direction: row; justify-content: center; gap: var(--whenGap); }
html[data-r="9x16"] .v--city { display: block; }
/* In the band the venue is the LAST item, so its trailing letter-space would
   push the whole row 3.5px left of centre. Drop the indent and pull the same
   amount off the right margin instead: ink now ends flush with the row. */
html[data-r="9x16"] .city { margin: 0 -.26em 0 0; text-indent: 0; }

/* ====================================================================== 4:5
   Chins on the render: Mohinur y785 = 52.2% of the box, Sarvinoz's hand y742
   = 45.8%. Same treatment as the Story — full alpha through the caption band,
   the maroon drunk in by the sink instead of a half-dissolved blouse.       */
html[data-r="4x5"] .canvas {
  --padX: 78px; --gTop: 68px; --gBot: 58px;
  --logoW: 152px; --gapLogo: 28px; --gapHost: 10px;
  --figW: 560px; --figH: 656px; --figOv: 196px;
  --stageTop: 442px; --stageShift: 17px; --maskX: 6%;
  --fadeA: 86%; --fadeB: 100%;
  --sinkA: 57%; --sinkM: 62%; --sinkE: 67%;
  --sinkAs: 51%; --sinkMs: 56%; --sinkEs: 60.5%;
  --namesTop: 838px; --capW: 420px; --capOff: 154px;
  --scrimTop: 830px; --scrimOp: .78;
  --fsTitle: 78px; --fsHost: 40px;
  --fsTag: 19px; --fsName: 30px; --fsRole: 24px;
  --fsLbl: 19px; --fsTopic: 45px; --fsTopic2: 34px;
  --fsDate: 56px; --fsCity: 24px;
  --markW: 240px; --gapMark: 14px; --gapWhen: 13px; --whenGap: 30px; --gapCity: 10px;
}

/* ====================================================================== 1:1
   Chins on the render: Mohinur y646 = 49.0% of the box, Sarvinoz's hand y605
   = 43.0%. The square is the tight cut, so the sink ramps fastest here — but
   it still opens 14px clear of the lower of the two chins.                  */
html[data-r="1x1"] .canvas {
  --padX: 72px; --gTop: 68px; --gBot: 56px;
  --logoW: 104px; --gapLogo: 10px; --gapHost: 3px;
  --figW: 537px; --figH: 690px; --figOv: 138px;
  --stageTop: 308px; --stageShift: 16px; --maskX: 6%;
  --fadeA: 86%; --fadeB: 100%;
  --sinkA: 51%; --sinkM: 54.5%; --sinkE: 58%;
  --sinkAs: 45%; --sinkMs: 50%; --sinkEs: 54%;
  --namesTop: 680px; --capW: 400px; --capOff: 173px;
  --scrimTop: 670px; --scrimOp: .82;
  --fsTitle: 54px; --fsHost: 30px;
  --fsTag: 14px; --fsName: 25px; --fsRole: 24px;
  --fsLbl: 16px; --fsTopic: 33px; --fsTopic2: 29px;
  --fsDate: 45px; --fsCity: 20px;
  --markW: 170px; --gapMark: 12px; --gapWhen: 11px; --whenGap: 24px; --gapCity: 8px;
}
/* 1:1 is the compact cut — single-line names keep the stack tight */
html[data-r="1x1"] .nm br { display: none; }
html[data-r="1x1"] .nm { white-space: nowrap; }
</style>
</head>
<body>
<div class="canvas grain">
  <div class="layer ground"></div>

  <div class="stage">
    <figure class="fig fig--m">
      <span class="fig-in">
        <img class="ph ph--mohinur" src="assets/cutout/mohinur-cut-soft.png" alt="Mohinur Abdullayeva">
        <span class="sink"></span>
      </span>
    </figure>
    <figure class="fig fig--s">
      <span class="fig-in">
        <img class="ph ph--sarvinoz" src="assets/cutout/sarvinoz-cut-soft.png" alt="Sarvinoz Alisherovna">
        <span class="sink"></span>
      </span>
    </figure>
  </div>

  <div class="scrim"></div>
  <div class="layer vig"></div>

  <header class="head">
    <img class="logo" src="assets/logo-cream-trim.png" alt="Diva Women Networking Club">
    <h1 class="title">Diva klubi<br>uchrashuvi</h1>
    <p class="host">Mohinur Abdullayeva bilan</p>
  </header>

  <div class="names">
    <div class="cap cap--l">
      <div class="tag"></div>
      <div class="nm">Mohinur<br> Abdullayeva</div>
    </div>
    <div class="cap cap--r">
      <div class="tag">Mehmon spiker</div>
      <div class="nm">Sarvinoz<br> Alisherovna</div>
      <div class="role">psixolog, vrach psixoterapevt</div>
    </div>
  </div>

  <footer class="foot">
    <p class="lbl">Uchrashuv mavzusi</p>
    <p class="topic">Shukronalik hissi.</p>
    <p class="topic2">1 ta katta maqsad uchun ongni tayyorlash</p>
    <div class="mark"></div>
    <div class="whenwrap">
      <div class="when">
        <span class="d num">16-sentabr</span>
        <i class="v"></i>
        <span class="d num">11:00</span>
      </div>
      <i class="v v--city"></i>
      <p class="city">Toshkent sh.</p>
    </div>
  </footer>
</div>
</body>
</html>
