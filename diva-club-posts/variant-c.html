<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant C</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT C — "Editorial"
   Photography leads. Mohinur full-bleed and enormous, dissolving into a
   deep-maroon field. Modern fashion-magazine grid: one hairline, small-caps
   Jost labels, oversized Playfair. No frames, no circles, no ornament.
   ======================================================================= */

.canvas {
  background: #34020c;
  color: var(--cream);
  font-family: var(--serif);

  /* hero framing (uniform scale: height drives, width is auto) */
  --hz: 126%;          /* image height vs canvas height */
  --hx: -248px;        /* image left offset */
  --hy: -242px;        /* image top offset  */

  /* type scale */
  --t-title: 110px;
  --t-with: 46px;
  --t-label: 17px;
  --t-theme: 44px;
  --t-name: 38px;
  --t-role: 29px;
  --t-date: 46px;
  --t-city: 23px;

  /* layout */
  --gutter: 54px;
  --sw: 380px;         /* sarvinoz block width  */
  --sh: 450px;         /* sarvinoz block height */
}

/* ---------------------------------------------------------------- hero -- */
.hero { position: absolute; inset: 0; overflow: hidden; }
.hero img {
  position: absolute;
  height: var(--hz);
  width: auto;
  left: var(--hx);
  top: var(--hy);
  display: block;
}

/* warms the near-black studio ground into deep maroon without crushing the
   face — screen lifts the blacks, the face only gains a touch of warmth */
.tone {
  background: linear-gradient(168deg, #430316 0%, #340210 46%, #34020c 100%);
  mix-blend-mode: screen;
}

/* the scrim is a long ramp that stays at ZERO across her face */
.scrim { background: var(--scrim); }
.canvas {
  --scrim: linear-gradient(180deg,
      rgba(34,1,8,0.46) 0%,
      rgba(34,1,8,0.10) 8%,
      rgba(34,1,8,0.00) 20%,
      rgba(34,1,8,0.00) 42%,
      rgba(42,1,10,0.38) 47%,
      rgba(46,2,11,0.80) 50.5%,
      rgba(52,2,12,0.96) 54%,
      #34020c 58%,
      #34020c 100%);
}

/* a quiet horizontal falloff so the left margin never competes with her */
.side {
  background: linear-gradient(90deg, rgba(34,1,8,0.42) 0%, rgba(34,1,8,0.0) 26%);
}

/* ------------------------------------------------------------- masthead -- */
.mark {
  position: absolute;
  top: var(--pad);
  left: var(--pad);
  width: 232px;
  height: auto;
  filter: drop-shadow(0 2px 20px rgba(0,0,0,0.45));
}

/* ---------------------------------------------------------------- stack -- */
.stack {
  position: absolute;
  left: var(--pad);
  right: var(--pad);
  bottom: var(--pad);
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-title);
  line-height: 0.98;
  letter-spacing: -0.018em;
  margin: 0;
  color: #fdf7ee;
}
.title em { font-style: italic; font-weight: 400; }

.with {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--t-with);
  line-height: 1.1;
  color: var(--gold-soft);
  margin-top: 14px;
}

.rule { height: 1px; background: rgba(201,162,91,0.55); flex: 0 0 auto; }
.r1 { margin-top: 44px; }
.r2 { margin-top: 38px; }

/* the information row: text column + guest-speaker portrait */
.row {
  display: flex;
  align-items: flex-start;
  gap: var(--gutter);
  margin-top: 38px;
}
.col { flex: 1 1 auto; min-width: 0; }

.label {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--t-label);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold-soft);
  text-indent: 0.34em;
}

.theme-text {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--t-theme);
  line-height: 1.2;
  color: #fdf7ee;
  margin-top: 14px;
  letter-spacing: 0.002em;
}

.spk { margin-top: 40px; }
.name {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-name);
  line-height: 1.08;
  color: #fdf7ee;
  margin-top: 10px;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--t-role);
  line-height: 1.22;
  color: var(--rose);
  margin-top: 4px;
}

/* guest-speaker portrait — frameless, hard-cut, grid-aligned */
.sarv {
  flex: 0 0 auto;
  position: relative;
  width: var(--sw);
  height: var(--sh);
  overflow: hidden;
  background: #e9ded0;
}
.sarv img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 45% 11%;
  display: block;
  filter: saturate(0.9) contrast(1.02) brightness(1.01);
}
.sarv::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(147,6,31,0.06), rgba(122,5,25,0.16));
  mix-blend-mode: multiply;
}

/* ----------------------------------------------------------------- when -- */
.when {
  display: flex;
  align-items: baseline;
  gap: 26px;
  margin-top: 28px;
}
.date {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-date);
  color: #fdf7ee;
  letter-spacing: 0.004em;
}
.bar {
  width: 46px; height: 1px;
  background: var(--gold);
  align-self: center;
  flex: 0 0 auto;
}
.city {
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--t-city);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-left: auto;
}

/* ======================================================= ratio overrides = */

/* ---- 9:16 — full-height portrait, type stacked low ---- */
html[data-r="9x16"] .canvas {
  --hz: 126%; --hx: -248px; --hy: -242px;
  --t-title: 110px; --t-with: 46px; --t-theme: 44px; --t-name: 38px;
  --t-role: 29px; --t-date: 48px; --t-city: 23px;
  --sw: 380px; --sh: 450px; --gutter: 56px;
}

/* ---- 4:5 — portrait right, information band low ---- */
html[data-r="4x5"] .canvas {
  --hz: 128%; --hx: -160px; --hy: -190px;
  --t-title: 84px; --t-with: 38px; --t-label: 15px; --t-theme: 36px;
  --t-name: 32px; --t-role: 25px; --t-date: 40px; --t-city: 19px;
  --sw: 290px; --sh: 320px; --gutter: 44px;
}
html[data-r="4x5"] .mark { width: 196px; }
html[data-r="4x5"] .row { flex-direction: row-reverse; margin-top: 30px; }
html[data-r="4x5"] .r1 { margin-top: 32px; }
html[data-r="4x5"] .r2 { margin-top: 30px; }
html[data-r="4x5"] .when { margin-top: 22px; }
html[data-r="4x5"] .spk { margin-top: 28px; }

/* ---- 1:1 — hard vertical split: photo column | type column ---- */
html[data-r="1x1"] .canvas {
  --hz: 118%; --hx: -126px; --hy: -78px;
  --split: 520px;
  --t-title: 66px; --t-with: 32px; --t-label: 14px; --t-theme: 30px;
  --t-name: 28px; --t-role: 22px; --t-date: 34px; --t-city: 17px;
}
html[data-r="1x1"] .hero { inset: 0 auto 380px 0; width: var(--split); }
html[data-r="1x1"] .scrim,
html[data-r="1x1"] .side { display: none; }
html[data-r="1x1"] .tone { inset: 0 auto 380px 0; width: var(--split); }
html[data-r="1x1"] .mark { left: calc(var(--split) + 70px); top: 66px; width: 178px; }
html[data-r="1x1"] .stack { left: calc(var(--split) + 70px); right: var(--pad); bottom: var(--pad); }
html[data-r="1x1"] .row { display: block; margin-top: 26px; }
html[data-r="1x1"] .r1 { margin-top: 26px; }
html[data-r="1x1"] .r2 { margin-top: 24px; }
html[data-r="1x1"] .when { margin-top: 20px; }
html[data-r="1x1"] .sarv {
  position: absolute;
  left: 0; bottom: 0;
  width: var(--split); height: 380px;
}
html[data-r="1x1"] .sarv img { object-position: 45% 9%; }
html[data-r="1x1"] .spk { margin-top: 26px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="hero"><img src="assets/mohinur.jpg" alt="Mohinur Abdullayeva"></div>
  <div class="layer tone"></div>
  <div class="layer side"></div>
  <div class="layer scrim"></div>
  <div class="layer grain"></div>

  <img class="mark" src="assets/logo-white-trim.png" alt="Diva Women Networking Club">

  <div class="stack">
    <h1 class="title">Diva klubi<br><em>uchrashuvi</em></h1>
    <div class="with">Mohinur Abdullayeva bilan</div>

    <div class="rule r1"></div>

    <div class="row">
      <div class="col">
        <div class="label">Uchrashuv mavzusi</div>
        <div class="theme-text">Shukronalik hissi.<br>1 ta katta maqsad uchun ongni tayyorlash</div>

        <div class="spk">
          <div class="label">Mehmon spiker</div>
          <div class="name">Sarvinoz Alisherovna</div>
          <div class="role">psixolog, vrach psixoterapevt</div>
        </div>
      </div>

      <div class="sarv"><img src="assets/sarvinoz.jpg" alt="Sarvinoz Alisherovna"></div>
    </div>

    <div class="rule r2"></div>

    <div class="when">
      <span class="date num">16-sentabr</span>
      <span class="bar"></span>
      <span class="date num">11:00</span>
      <span class="city">Toshkent sh.</span>
    </div>
  </div>
</div>
</body>
</html>
