<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant C</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT C — "Editorial"
   Photography leads. Mohinur full-bleed and enormous, her near-black studio
   ground dissolved into deep maroon. A modern fashion-magazine grid:
   two hairline gold rules, small-caps Jost labels, oversized Playfair.
   No frames, no circles, no ornament.
   ======================================================================= */

.canvas {
  background: #34020c;
  color: var(--cream);
  font-family: var(--serif);

  /* hero framing — uniform scale: height drives, width stays auto */
  --hz: 118%;
  --hx: -57px;
  --hy: -215px;

  /* guest framing, same technique */
  --sz: 196%;
  --sx: -78px;
  --sy: 6px;

  /* type scale */
  --t-title: 116px;
  --t-with: 46px;
  --t-label: 17px;
  --t-theme: 44px;
  --t-name: 38px;
  --t-role: 29px;
  --t-date: 48px;
  --t-city: 23px;

  /* layout */
  --gutter: 56px;
  --sw: 430px;
  --sh: 540px;
}

/* ---------------------------------------------------------------- hero -- */
.hero { position: absolute; inset: 0; overflow: hidden; }
.hero > img {
  position: absolute;
  height: var(--hz);
  width: auto;
  left: var(--hx);
  top: var(--hy);
  display: block;
}
.hero > .tone,
.hero > .scrim,
.hero > .side { position: absolute; inset: 0; pointer-events: none; }

/* screen lifts the near-black studio ground into deep maroon;
   the face only picks up a little warmth */
.tone {
  background: linear-gradient(168deg, #430317 0%, #350210 48%, #34020c 100%);
  mix-blend-mode: screen;
}

/* long ramp that sits at ZERO opacity across her face */
.scrim {
  background: linear-gradient(180deg,
      rgba(34,1,8,0.50) 0%,
      rgba(34,1,8,0.12) 7%,
      rgba(34,1,8,0.00) 18%,
      rgba(34,1,8,0.00) 38%,
      rgba(40,1,10,0.30) 42%,
      rgba(45,2,11,0.72) 45.5%,
      rgba(50,2,12,0.94) 49%,
      #34020c 53%,
      #34020c 100%);
}

/* quiet horizontal falloff so the left margin never competes with her */
.side { background: linear-gradient(90deg, rgba(34,1,8,0.46) 0%, rgba(34,1,8,0) 30%); }

/* ------------------------------------------------------------- masthead -- */
.mark {
  position: absolute;
  top: var(--pad);
  left: var(--pad);
  width: 226px;
  height: auto;
  filter: drop-shadow(0 2px 22px rgba(0,0,0,0.5));
}

/* ---------------------------------------------------------------- stack -- */
.stack {
  position: absolute;
  left: var(--pad);
  right: var(--pad);
  bottom: var(--pad);
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-title);
  line-height: 0.97;
  letter-spacing: -0.022em;
  margin: 0;
  color: #fdf7ee;
}
.title em { font-style: italic; font-weight: 400; }

.with {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--t-with);
  line-height: 1.1;
  color: var(--gold-soft);
  margin-top: 14px;
}

.rule { height: 1px; background: rgba(201,162,91,0.5); flex: 0 0 auto; }
.r1 { margin-top: 42px; }
.r2 { margin-top: 38px; }

/* information row: text column + guest portrait, both bounded by the rules */
.row {
  display: flex;
  align-items: stretch;
  gap: var(--gutter);
  margin-top: 38px;
}
.col {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--t-label);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold-soft);
  text-indent: 0.34em;
}

.theme-text {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--t-theme);
  line-height: 1.2;
  color: #fdf7ee;
  margin-top: 14px;
}

.name {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-name);
  line-height: 1.08;
  color: #fdf7ee;
  margin-top: 12px;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--t-role);
  line-height: 1.22;
  color: var(--rose);
  margin-top: 4px;
}

/* guest portrait — frameless hard-cut crop, warm-graded into the palette */
.sarv, .duo { position: relative; overflow: hidden; background: #d8b8b0; }
.sarv { flex: 0 0 auto; width: var(--sw); height: var(--sh); }
.sarv > img, .duo > img {
  position: absolute;
  height: var(--sz);
  width: auto;
  left: var(--sx);
  top: var(--sy);
  display: block;
  filter: saturate(0.9) contrast(1.02) brightness(0.97);
}
.sarv::after, .duo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(200deg, rgba(228,198,182,0.28), rgba(194,132,124,0.44));
  mix-blend-mode: multiply;
}
.duo { display: none; }

/* ----------------------------------------------------------------- when -- */
.when { display: flex; align-items: baseline; gap: 26px; margin-top: 30px; }
.date {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-date);
  color: #fdf7ee;
}
.bar { width: 46px; height: 1px; background: var(--gold); align-self: center; flex: 0 0 auto; }
.city {
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--t-city);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-left: auto;
}

/* ======================================================= ratio overrides = */

/* ---- 9:16 — full-height portrait, type stacked low ---- */
html[data-r="9x16"] .canvas {
  --hz: 118%; --hx: -57px; --hy: -215px;
  --sz: 268%; --sx: -203px; --sy: -154px;
  --t-title: 116px; --t-with: 46px; --t-theme: 44px; --t-name: 38px;
  --t-role: 29px; --t-date: 48px; --t-city: 23px;
  --sw: 434px; --sh: 506px; --gutter: 54px;
}

/* ---- 4:5 — portrait dominates, guest block bottom-left ---- */
html[data-r="4x5"] .canvas {
  --hz: 132%; --hx: -50px; --hy: -205px;
  --sz: 280%; --sx: -129px; --sy: -105px;
  --t-title: 80px; --t-with: 36px; --t-label: 15px; --t-theme: 34px;
  --t-name: 30px; --t-role: 24px; --t-date: 40px; --t-city: 19px;
  --sw: 360px; --sh: 356px; --gutter: 46px;
}
html[data-r="4x5"] .mark { width: 190px; }
html[data-r="4x5"] .row { flex-direction: row-reverse; margin-top: 30px; }
html[data-r="4x5"] .r1 { margin-top: 32px; }
html[data-r="4x5"] .r2 { margin-top: 30px; }
html[data-r="4x5"] .when { margin-top: 22px; }

/* ---- 1:1 — double-portrait band over a full-width type band ---- */
html[data-r="1x1"] .canvas {
  --band: 548px;
  --seam: 660px;
  --hz: 230%; --hx: -91px; --hy: -104px;
  --sz: 235%; --sx: -189px; --sy: -133px;
  --t-title: 62px; --t-with: 32px; --t-label: 13px; --t-theme: 28px;
  --t-name: 28px; --t-role: 22px; --t-date: 36px; --t-city: 16px;
  --gutter: 48px;
}
html[data-r="1x1"] .hero { inset: 0 auto auto 0; width: var(--seam); height: var(--band); }
html[data-r="1x1"] .hero > .scrim {
  background: linear-gradient(180deg, rgba(34,1,8,0.34) 0%, rgba(34,1,8,0) 14%);
}
html[data-r="1x1"] .hero > .side { background: linear-gradient(90deg, rgba(34,1,8,0.26) 0%, rgba(34,1,8,0) 22%); }
html[data-r="1x1"] .mark { width: 152px; top: 58px; left: 58px; }
html[data-r="1x1"] .duo {
  display: block;
  position: absolute;
  top: 0; left: var(--seam); right: 0;
  height: var(--band);
}
html[data-r="1x1"] .sarv { display: none; }
html[data-r="1x1"] .r1 { margin-top: 26px; }
html[data-r="1x1"] .r2 { margin-top: 24px; }
html[data-r="1x1"] .row { margin-top: 24px; }
html[data-r="1x1"] .col { flex-direction: row; align-items: flex-start; gap: 48px; }
html[data-r="1x1"] .themeblock { flex: 1 1 56%; min-width: 0; }
html[data-r="1x1"] .spk { flex: 1 1 44%; min-width: 0; }
html[data-r="1x1"] .when { margin-top: 22px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="hero">
    <img src="assets/derived/mohinur-warm.jpg" alt="Mohinur Abdullayeva">
    <div class="tone"></div>
    <div class="side"></div>
    <div class="scrim"></div>
  </div>

  <div class="duo"><img src="assets/derived/sarvinoz-warm.jpg" alt="Sarvinoz Alisherovna"></div>

  <div class="layer grain"></div>

  <img class="mark" src="assets/logo-white-trim.png" alt="Diva Women Networking Club">

  <div class="stack">
    <h1 class="title">Diva klubi<br><em>uchrashuvi</em></h1>
    <div class="with">Mohinur Abdullayeva bilan</div>

    <div class="rule r1"></div>

    <div class="row">
      <div class="col">
        <div class="themeblock">
          <div class="label">Uchrashuv mavzusi</div>
          <div class="theme-text">Shukronalik hissi.<br>1 ta katta maqsad uchun ongni tayyorlash</div>
        </div>

        <div class="spk">
          <div class="label">Mehmon spiker</div>
          <div class="name">Sarvinoz Alisherovna</div>
          <div class="role">psixolog, vrach psixoterapevt</div>
        </div>
      </div>

      <div class="sarv"><img src="assets/derived/sarvinoz-warm.jpg" alt="Sarvinoz Alisherovna"></div>
    </div>

    <div class="rule r2"></div>

    <div class="when">
      <span class="date num">16-sentabr</span>
      <span class="bar"></span>
      <span class="date num">11:00</span>
      <span class="city">Toshkent sh.</span>
    </div>
  </div>
</div>
</body>
</html>
