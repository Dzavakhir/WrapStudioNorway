<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diva klubi uchrashuvi — Variant C</title>
<link rel="stylesheet" href="base.css">
<script src="lib.js"></script>
<style>
/* =======================================================================
   VARIANT C — "Editorial"
   Photography leads. Mohinur full-bleed and enormous, her near-black studio
   ground dissolved into deep maroon. Modern fashion-magazine grid: hairline
   gold rules, small-caps Jost labels, oversized Playfair.
   No frames, no circles, no ornament.
   ======================================================================= */

.canvas {
  background: #34020c;
  color: var(--cream);
  font-family: var(--serif);

  /* hero framing — uniform scale: height drives, width stays auto */
  --hz: 118%;
  --hx: -57px;
  --hy: -190px;

  /* type scale */
  --t-title: 110px;
  --t-with: 46px;
  --t-label: 17px;
  --t-theme: 44px;
  --t-name: 38px;
  --t-role: 29px;
  --t-date: 48px;
  --t-city: 23px;

  /* layout */
  --gutter: 56px;
  --sw: 400px;
  --sh: 470px;
}

/* ---------------------------------------------------------------- hero -- */
.hero { position: absolute; inset: 0; overflow: hidden; }
.hero > img {
  position: absolute;
  height: var(--hz);
  width: auto;
  left: var(--hx);
  top: var(--hy);
  display: block;
}
.hero > .tone,
.hero > .scrim,
.hero > .side { position: absolute; inset: 0; pointer-events: none; }

/* screen lifts the near-black ground into deep maroon; the face only warms */
.tone {
  background: linear-gradient(168deg, #450318 0%, #360211 48%, #34020c 100%);
  mix-blend-mode: screen;
}

/* the scrim is a long ramp that sits at ZERO opacity across her face */
.scrim {
  background: linear-gradient(180deg,
      rgba(34,1,8,0.50) 0%,
      rgba(34,1,8,0.12) 7%,
      rgba(34,1,8,0.00) 18%,
      rgba(34,1,8,0.00) 40%,
      rgba(40,1,10,0.30) 44%,
      rgba(45,2,11,0.72) 47.5%,
      rgba(50,2,12,0.94) 51%,
      #34020c 55%,
      #34020c 100%);
}

/* quiet horizontal falloff so the left margin never competes with her */
.side { background: linear-gradient(90deg, rgba(34,1,8,0.46) 0%, rgba(34,1,8,0) 30%); }

/* ------------------------------------------------------------- masthead -- */
.mark {
  position: absolute;
  top: var(--pad);
  left: var(--pad);
  width: 226px;
  height: auto;
  filter: drop-shadow(0 2px 22px rgba(0,0,0,0.5));
}

/* ---------------------------------------------------------------- stack -- */
.stack {
  position: absolute;
  left: var(--pad);
  right: var(--pad);
  bottom: var(--pad);
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.head .mark-inline { display: none; }

.title {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-title);
  line-height: 0.98;
  letter-spacing: -0.02em;
  margin: 0;
  color: #fdf7ee;
}
.title em { font-style: italic; font-weight: 400; }

.with {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: var(--t-with);
  line-height: 1.1;
  color: var(--gold-soft);
  margin-top: 14px;
}

.rule { height: 1px; background: rgba(201,162,91,0.5); flex: 0 0 auto; }
.r1 { margin-top: 44px; }
.r2 { margin-top: 38px; }

/* information row: text column + guest-speaker portrait */
.row {
  display: flex;
  align-items: flex-start;
  gap: var(--gutter);
  margin-top: 38px;
}
.col { flex: 1 1 auto; min-width: 0; }

.label {
  font-family: var(--sans);
  font-weight: 400;
  font-size: var(--t-label);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold-soft);
  text-indent: 0.34em;
}

.theme-text {
  font-family: var(--serif);
  font-weight: 500;
  font-size: var(--t-theme);
  line-height: 1.2;
  color: #fdf7ee;
  margin-top: 14px;
}

.spk { margin-top: 40px; }
.name {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-name);
  line-height: 1.08;
  color: #fdf7ee;
  margin-top: 10px;
}
.role {
  font-family: var(--serif);
  font-style: italic;
  font-size: var(--t-role);
  line-height: 1.22;
  color: var(--rose);
  margin-top: 4px;
}

/* guest-speaker portrait — frameless, hard-cut, grid-aligned */
.sarv {
  flex: 0 0 auto;
  position: relative;
  width: var(--sw);
  height: var(--sh);
  overflow: hidden;
  background: #e6d8ca;
}
.sarv img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 45% 6%;
  display: block;
  filter: saturate(0.8) contrast(1.05) sepia(0.12);
}
.sarv::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(200deg, rgba(232,205,198,0.34), rgba(201,140,138,0.46));
  mix-blend-mode: multiply;
}

/* second-panel variant used only by the 1:1 double portrait */
.duo { display: none; }

/* ----------------------------------------------------------------- when -- */
.when { display: flex; align-items: baseline; gap: 26px; margin-top: 28px; }
.date {
  font-family: var(--display);
  font-weight: 500;
  font-size: var(--t-date);
  color: #fdf7ee;
}
.bar { width: 46px; height: 1px; background: var(--gold); align-self: center; flex: 0 0 auto; }
.city {
  font-family: var(--sans);
  font-weight: 300;
  font-size: var(--t-city);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-left: auto;
}

/* ======================================================= ratio overrides = */

/* ---- 9:16 — full-height portrait, type stacked low ---- */
html[data-r="9x16"] .canvas {
  --hz: 118%; --hx: -57px; --hy: -190px;
  --t-title: 110px; --t-with: 46px; --t-theme: 44px; --t-name: 38px;
  --t-role: 29px; --t-date: 48px; --t-city: 23px;
  --sw: 400px; --sh: 470px; --gutter: 56px;
}

/* ---- 4:5 — portrait dominates, wide guest block bottom-left ---- */
html[data-r="4x5"] .canvas {
  --hz: 132%; --hx: -50px; --hy: -195px;
  --t-title: 78px; --t-with: 36px; --t-label: 15px; --t-theme: 34px;
  --t-name: 30px; --t-role: 24px; --t-date: 40px; --t-city: 19px;
  --sw: 330px; --sh: 330px; --gutter: 44px;
}
html[data-r="4x5"] .mark { width: 190px; }
html[data-r="4x5"] .row { flex-direction: row-reverse; margin-top: 30px; }
html[data-r="4x5"] .r1 { margin-top: 32px; }
html[data-r="4x5"] .r2 { margin-top: 30px; }
html[data-r="4x5"] .when { margin-top: 20px; }
html[data-r="4x5"] .spk { margin-top: 30px; }

/* ---- 1:1 — double-portrait band over a full-width type band ---- */
html[data-r="1x1"] .canvas {
  --band: 542px;
  --seam: 632px;
  --hz: 232%; --hx: -152px; --hy: -110px;
  --t-title: 60px; --t-with: 31px; --t-label: 13px; --t-theme: 28px;
  --t-name: 27px; --t-role: 22px; --t-date: 34px; --t-city: 16px;
  --gutter: 48px;
}
html[data-r="1x1"] .hero { inset: 0 auto auto 0; width: var(--seam); height: var(--band); }
html[data-r="1x1"] .hero > .scrim { display: none; }
html[data-r="1x1"] .hero > .side { background: linear-gradient(90deg, rgba(34,1,8,0.34) 0%, rgba(34,1,8,0) 26%); }
html[data-r="1x1"] .mark { display: none; }
html[data-r="1x1"] .head .mark-inline {
  display: block;
  width: 168px; height: auto;
  flex: 0 0 auto;
  margin-bottom: 6px;
}
html[data-r="1x1"] .duo {
  display: block;
  position: absolute;
  top: 0; left: var(--seam); right: 0;
  height: var(--band);
  overflow: hidden;
  background: #e6d8ca;
}
html[data-r="1x1"] .duo > img {
  position: absolute;
  height: 178%;
  width: auto;
  left: -62px;
  top: -38px;
  display: block;
  filter: saturate(0.8) contrast(1.05) sepia(0.12);
}
html[data-r="1x1"] .duo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(200deg, rgba(232,205,198,0.34), rgba(201,140,138,0.46));
  mix-blend-mode: multiply;
}
html[data-r="1x1"] .sarv { display: none; }
html[data-r="1x1"] .stack { left: var(--pad); right: var(--pad); bottom: var(--pad); }
html[data-r="1x1"] .r1 { margin-top: 26px; }
html[data-r="1x1"] .r2 { margin-top: 24px; }
html[data-r="1x1"] .row { margin-top: 24px; }
html[data-r="1x1"] .col { flex: 1 1 56%; }
html[data-r="1x1"] .spk { display: block; margin-top: 0; flex: 1 1 44%; }
html[data-r="1x1"] .when { margin-top: 20px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="hero">
    <img src="assets/mohinur.jpg" alt="Mohinur Abdullayeva">
    <div class="tone"></div>
    <div class="side"></div>
    <div class="scrim"></div>
  </div>

  <div class="duo"><img src="assets/sarvinoz.jpg" alt="Sarvinoz Alisherovna"></div>

  <div class="layer grain"></div>

  <img class="mark" src="assets/logo-white-trim.png" alt="Diva Women Networking Club">

  <div class="stack">
    <div class="head">
      <div class="headtext">
        <h1 class="title">Diva klubi<br><em>uchrashuvi</em></h1>
        <div class="with">Mohinur Abdullayeva bilan</div>
      </div>
      <img class="mark-inline" src="assets/logo-cream-trim.png" alt="Diva Women Networking Club">
    </div>

    <div class="rule r1"></div>

    <div class="row">
      <div class="col">
        <div class="label">Uchrashuv mavzusi</div>
        <div class="theme-text">Shukronalik hissi.<br>1 ta katta maqsad uchun ongni tayyorlash</div>

        <div class="spk">
          <div class="label">Mehmon spiker</div>
          <div class="name">Sarvinoz Alisherovna</div>
          <div class="role">psixolog, vrach psixoterapevt</div>
        </div>
      </div>

      <div class="sarv"><img src="assets/sarvinoz.jpg" alt="Sarvinoz Alisherovna"></div>
    </div>

    <div class="rule r2"></div>

    <div class="when">
      <span class="date num">16-sentabr</span>
      <span class="bar"></span>
      <span class="date num">11:00</span>
      <span class="city">Toshkent sh.</span>
    </div>
  </div>
</div>
</body>
</html>
