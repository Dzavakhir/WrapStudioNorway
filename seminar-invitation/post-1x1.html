<!doctype html>
<meta charset="utf-8">
<title>SUPER AI — Jonli seminar taklifnomasi 1:1</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .canvas { width: 1080px; height: 1080px; padding: 58px 64px 58px; }

  .head { display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-size: 27px; letter-spacing: 0.16em; gap: 11px; }
  .wordmark .mark { width: 16px; height: 16px; }
  .pill { font-size: 14px; letter-spacing: 0.16em; padding: 9px 18px; gap: 8px; }
  .pill .dot { width: 7px; height: 7px; }
  .head + .rule { margin-top: 20px; }

  .lede { margin-top: 22px; font-size: 16px; letter-spacing: 0.14em; text-align: center; }
  .title { margin-top: 12px; font-size: 94px; text-align: center; }

  .stage { margin-top: 8px; height: 380px; }
  .stage .arch { width: 540px; top: -8px; bottom: -4px; margin-left: -11px; }
  .stage img { width: 626px; align-self: flex-end; }

  .names { margin-top: 12px; justify-content: center; gap: 26px; align-items: center; }
  .names .sep { width: 1px; height: 26px; background: var(--rule); }
  .names > div:not(.sep) { text-align: center; }
  .name { font-size: 22px; }
  .role { font-size: 14px; margin-top: 3px; }

  .claim { margin-top: 38px; font-size: 35px; line-height: 1.24; text-align: center; }

  .invite { margin-top: 18px; font-size: 19px; font-weight: 600; color: var(--red);
            text-align: center; letter-spacing: 0.01em; }

  .ticket { margin-top: auto; padding: 18px 26px 20px; border-radius: 16px;
            display: flex; align-items: flex-end; gap: 26px; }
  .ticket .field { display: flex; flex-direction: column; }
  .ticket .field.grow { flex: 1; }
  .ticket .label { font-size: 13px; letter-spacing: 0.16em; }
  .blank { height: 34px; margin-top: 6px; }
  .ticket .num { width: 104px; }
</style>

<div class="canvas">
  <div class="head">
    <div class="wordmark"><span class="mark"></span>SUPER <span class="ai">AI</span></div>
    <div class="pill"><span class="dot"></span>Taklifnoma</div>
  </div>
  <div class="rule"></div>

  <div class="lede eyebrow">Javohir Mamatqulov va Zilola Saidqulovadan</div>
  <div class="title">Jonli <span class="accent">seminar</span></div>

  <div class="stage">
    <div class="arch"></div>
    <img src="assets/speakers-pair.png" alt="Javohir Mamatqulov va Zilola Saidqulova">
  </div>

  <div class="names">
    <div>
      <div class="name">Javohir Mamatqulov</div>
      <div class="role">Spiker</div>
    </div>
    <div class="sep"></div>
    <div>
      <div class="name">Zilola Saidqulova</div>
      <div class="role">Spiker</div>
    </div>
  </div>

  <div class="claim">Sunʼiy intellekt sizni boshqarmasidan oldin<br><b>siz uni boshqarishni oʻrganing!</b></div>

  <div class="invite">Seminarda sizni kutamiz!</div>

  <div class="ticket">
    <div class="field grow">
      <div class="label">Ism, familiya</div>
      <div class="blank"></div>
    </div>
    <div class="field num">
      <div class="label">Oʻrindiq</div>
      <div class="blank"></div>
    </div>
    <div class="field num">
      <div class="label">Qator</div>
      <div class="blank"></div>
    </div>
  </div>
</div>
